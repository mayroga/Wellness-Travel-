<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030305">
<title>MAY ROGA LLC — OPEN THAN GO ELITE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👑%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-obsidian:#030305;--bg-surface:#0a0a0e;--bg-glass:rgba(12,12,16,.96);--gold-champagne:#C5A059;--gold-light:#DFBF7A;--gold-dark:#91723B;--gold-glow:rgba(197,160,89,.25);--white-ivory:#F9F9FB;--text-muted:#8E8E93;--alert-crimson:#C0392B;--wellness-green:#27AE60;--border-subtle:rgba(197,160,89,.15)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
html,body,.container{-ms-overflow-style:none;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.container::-webkit-scrollbar,textarea::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;background:transparent!important;-webkit-appearance:none!important}
html,body{width:100%;height:100%;min-height:100%;background:var(--bg-obsidian);color:var(--white-ivory);font-family:'Inter',sans-serif;overscroll-behavior:none}
body{display:flex;justify-content:center;align-items:center;overflow:hidden;position:fixed;inset:0}
body::before{content:"";position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(197,160,89,.04) 0%,rgba(0,0,0,0) 70%);top:50%;left:50%;transform:translate(-50%,-50%);z-index:-1;pointer-events:none}
.container{max-width:520px;width:100%;height:100%;max-height:92vh;background:linear-gradient(165deg,var(--bg-glass),var(--bg-obsidian));backdrop-filter:blur(50px) saturate(180%)!important;-webkit-backdrop-filter:blur(50px) saturate(180%)!important;border:1px solid var(--border-subtle)!important;border-radius:28px;padding:32px 24px;box-shadow:0 40px 100px rgba(0,0,0,.98),0 0 80px rgba(197,160,89,.03),inset 0 1px 0 rgba(255,255,255,.02)!important;display:flex;flex-direction:column;position:relative;overflow-y:auto;transform:translateZ(0);will-change:transform,opacity;transition:all .5s cubic-bezier(.16,1,.3,1)!important}
.hidden{display:none!important}
header{text-align:center;border-bottom:1px solid rgba(197,160,89,.12);padding-bottom:14px;margin-bottom:20px}
header h1{font-family:'Cinzel',serif!important;font-size:26px;font-weight:500;letter-spacing:6px;color:var(--gold-champagne)!important;text-transform:uppercase;cursor:pointer;user-select:none;text-shadow:0 0 15px var(--gold-glow)!important;transition:color .4s ease,text-shadow .4s ease!important}
header h1:hover{color:var(--gold-light)!important;text-shadow:0 0 25px rgba(223,191,122,.5)!important}
.subtitle-elite{font-size:9.5px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;margin-top:4px}
.lang-bar{display:flex;gap:12px;margin-bottom:20px}
.btn-lang{flex:1;background:rgba(255,255,255,.01)!important;border:1px solid rgba(197,160,89,.12)!important;color:var(--text-muted)!important;padding:12px;border-radius:12px;font-size:13px;font-weight:600;letter-spacing:1.5px;cursor:pointer;transition:all .35s cubic-bezier(.16,1,.3,1)!important}
.btn-lang.active{background:var(--gold-champagne)!important;border-color:var(--gold-champagne)!important;color:var(--bg-obsidian)!important;box-shadow:0 0 20px var(--gold-glow)!important}
.field-group{display:flex;gap:12px;margin-bottom:16px}
.field-group label{display:block;font-size:11px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;letter-spacing:1px}
.field-group input,.field-group select,textarea{width:100%;background:rgba(255,255,255,.02)!important;border:1px solid rgba(197,160,89,.15)!important;color:var(--white-ivory)!important;padding:12px;border-radius:12px;font-size:13px;outline:none;font-family:'Inter',sans-serif!important;letter-spacing:.5px!important;transition:all .35s cubic-bezier(.16,1,.3,1)!important;-webkit-appearance:none!important;appearance:none!important}
.field-group select option{background:var(--bg-surface);color:var(--white-ivory)}
.field-group input:focus,.field-group select:focus,textarea:focus{border-color:var(--gold-champagne)!important;background:rgba(197,160,89,.03)!important;box-shadow:0 0 15px rgba(197,160,89,.12)!important}
textarea{resize:none;height:80px}
.interactive-stack-container{display:flex;flex-direction:column;gap:10px;margin-bottom:15px}
.btn-pregunta-crisis{width:100%;background:rgba(255,255,255,.01);border:1px solid rgba(197,160,89,.12);color:var(--white-ivory);padding:14px 16px;border-radius:14px;font-size:13px;text-align:left;cursor:pointer;transition:all .25s ease;line-height:1.4}
.btn-pregunta-crisis:hover{border-color:var(--gold-champagne);background:rgba(197,160,89,.05);transform:translateY(-1px)}
.gold-action-btn{width:100%;background:transparent!important;border:1px solid var(--gold-champagne)!important;color:var(--gold-champagne)!important;padding:16px;border-radius:50px;font-size:12.5px;font-weight:600;letter-spacing:2.5px!important;text-transform:uppercase;cursor:pointer;transition:all .4s cubic-bezier(.16,1,.3,1)!important;margin-top:10px;text-align:center;text-decoration:none;display:block;position:relative;overflow:hidden}
.gold-action-btn:hover{background:var(--gold-champagne)!important;color:var(--bg-obsidian)!important;box-shadow:0 0 30px var(--gold-glow)!important;transform:translateY(-1px)!important}
.gold-action-btn:active{transform:translateY(1px)!important}
.timer-header-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(197,160,89,.04);border:1px solid rgba(197,160,89,.15);border-radius:14px;padding:10px 18px;margin-bottom:20px}
.timer-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold-light)}
.timer-value{font-family:monospace;font-size:22px;color:var(--alert-crimson);font-weight:600;letter-spacing:1px}
.bio-respiration-dock{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:20px 0;position:relative;min-height:150px}
.lung-circle-master{width:125px;height:125px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold-light) 0%,var(--gold-champagne) 40%,var(--gold-dark) 100%)!important;border:1px solid rgba(255,255,255,.1)!important;box-shadow:0 0 40px rgba(197,160,89,.2),inset 0 -4px 12px rgba(0,0,0,.3)!important;display:flex;justify-content:center;align-items:center;font-family:'Cinzel',serif!important;font-size:13px!important;font-weight:600;letter-spacing:2px!important;color:var(--bg-obsidian)!important;text-transform:uppercase;text-shadow:0 1px 2px rgba(255,255,255,.2)!important;transition:transform 4000ms cubic-bezier(.4,0,.2,1),background 4000ms cubic-bezier(.4,0,.2,1),box-shadow 4000ms cubic-bezier(.4,0,.2,1)!important;text-align:center;padding:10px;white-space:pre-line;will-change:transform,background,box-shadow}
.lung-inhale-state{transform:scale(1.35) translateZ(0)!important;background:radial-gradient(circle at 35% 35%,#5dade2 0%,#3498db 45%,#1f618d 100%)!important;box-shadow:0 0 60px rgba(52,152,219,.45),inset 0 -4px 15px rgba(0,0,0,.4)!important;color:var(--white-ivory)!important;text-shadow:0 0 8px rgba(255,255,255,.6)!important}
.lung-exhale-state{transform:scale(.82) translateZ(0)!important;background:radial-gradient(circle at 35% 35%,#f1948a 0%,#e74c3c 45%,#922b21 100%)!important;box-shadow:0 0 35px rgba(231,76,60,.3),inset 0 -3px 10px rgba(0,0,0,.5)!important;color:var(--white-ivory)!important;text-shadow:0 0 8px rgba(255,255,255,.4)!important}
#txt-pulmon{font-family:'Inter',sans-serif!important;letter-spacing:1px!important;line-height:1.4;color:var(--gold-champagne)!important;opacity:.85;animation:premiumPulse 3s ease-in-out infinite alternate}
@keyframes premiumPulse{0%{opacity:.6;transform:scale(.98)}100%{opacity:.95;transform:scale(1)}}
#pantalla-cierre{position:fixed;inset:0;background:var(--bg-obsidian)!important;display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;z-index:99999!important;padding:20px;backdrop-filter:blur(60px)!important;-webkit-backdrop-filter:blur(60px)!important;transition:opacity .6s ease-in-out!important}
.cierre-content{background:rgba(10,10,14,.85)!important;border:1px solid rgba(197,160,89,.25)!important;padding:40px 32px!important;border-radius:24px!important;max-width:400px;width:100%;box-shadow:0 50px 120px rgba(0,0,0,.95)!important}
#cierre-timer{font-family:monospace!important;font-size:4rem!important;font-weight:700!important;color:var(--alert-crimson)!important;text-shadow:0 0 20px rgba(192,57,43,.4)!important;letter-spacing:-2px!important;margin:20px 0!important}
#cierre-mensaje-final{font-size:1.15rem;color:var(--wellness-green);margin:20px 0;font-weight:bold}
.floating-btn{position:fixed;bottom:20px;width:48px!important;height:48px!important;border-radius:50%!important;display:flex;justify-content:center;align-items:center;font-size:1.3rem;box-shadow:0 8px 24px rgba(0,0,0,.6)!important;cursor:pointer;z-index:100000;border:1px solid rgba(255,255,255,.08)!important;transition:all .3s cubic-bezier(.16,1,.3,1)!important}
#btn-volver-app{left:20px;background:var(--bg-surface)!important;color:var(--gold-champagne)!important;border-color:rgba(197,160,89,.2)!important}
#btn-whatsapp{right:75px;background:#1ebd56!important}
#btn-messenger{right:20px;background:#0066e4!important}
.floating-btn:hover{transform:translateY(-3px) scale(1.05)!important;box-shadow:0 12px 30px rgba(0,0,0,.8)!important}
@media(max-width:600px){body{position:fixed}.container{max-height:100vh;border-radius:0;border-left:0!important;border-right:0!important;padding:24px 18px}.field-group{gap:8px}.field-group input,.field-group select{padding:11px 8px;font-size:12px}header h1{font-size:22px;letter-spacing:4px}.subtitle-elite{letter-spacing:2px}}
</style>
</head>
<body>
<div id="pantalla-bienvenida" style="position:fixed;inset:0;background:var(--bg-obsidian);display:flex;justify-content:center;align-items:center;z-index:999999;">
<button type="button" class="gold-action-btn" onclick="KERNEL.despertarInicial();" style="width:auto;padding:20px 45px;border-radius:50px;font-size:14px;letter-spacing:2px;">INICIAR SESIÓN PRIVADA / START</button>
</div>

<div class="container hidden" id="wrapper-form">
<div class="lang-bar">
<button type="button" class="btn-lang active" id="lang-es" onclick="cambiarIdiomaUI('es')">ESP</button>
<button type="button" class="btn-lang" id="lang-en" onclick="cambiarIdiomaUI('en')">ENG</button>
</div>
<header>
<h1 id="brandTitleField">MAY ROGA LLC</h1>
<div class="subtitle-elite" id="lblBrandSub">Arquitectura de Santuarios Ejecutivos</div>
</header>

<div class="field-group">
<div style="flex:2;display:flex;flex-direction:column;">
<label id="lbl-zip">Código Postal</label>
<input type="text" id="inp-zip" placeholder="Ej: 33167" maxlength="5" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}" oninput="this.value=this.value.replace(/[^0-9]/g,'');">
</div>
<div style="flex:1;display:flex;flex-direction:column;">
<label>Modo</label>
<select id="modo-selector">
<option value="SALIR" selected>SALIR</option>
<option value="CASA">CASA</option>
</select>
</div>
</div>

<div class="field-group">
<div style="flex:1;display:flex;flex-direction:column;">
<label>Mente</label>
<select id="mente-selector">
<option value="aburrido" selected>Aburrido</option>
<option value="agotado">Agotado</option>
<option value="estresado">Estresado</option>
<option value="cansado">Cansado</option>
<option value="ansioso">Ansioso</option>
</select>
</div>
<div style="flex:1;display:flex;flex-direction:column;">
<label>Gasto</label>
<select id="budget-selector">
<option value="abierto" selected>Abierto</option>
<option value="ilimitado">Ilimitado</option>
</select>
</div>
<div style="flex:1;display:flex;flex-direction:column;">
<label>Perfil</label>
<select id="perfil-selector">
<option value="solo" selected>Solo</option>
<option value="acompanado">Acompañado</option>
<option value="familia">Familia</option>
<option value="empresa">Empresa</option>
<option value="accesible">Accesible</option>
</select>
</div>
</div>

<p id="lbl-oraculo-instruccion" style="font-size:11px;text-transform:uppercase;color:var(--gold-champagne);font-weight:bold;letter-spacing:1.5px;text-align:center;margin-bottom:15px;"></p>
<div style="position:relative;min-height:120px;overflow:hidden;margin-bottom:20px;">
<div class="interactive-stack-container" id="contenedor-preguntas-oraculo"></div>
</div>

<div style="margin-bottom:16px;">
<label id="lbl-desahogo" style="color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block;font-weight:500;"></label>
<textarea id="inp-text-libre" aria-label="Entrada libre"></textarea>
<button type="button" id="btn-activar-libre" class="gold-action-btn"></button>
</div>
</div>

<div class="container hidden" id="activeSessionDock">
<div class="timer-header-bar">
<span class="timer-title" id="lblTimerTitle">Ventana de Sintonía Activa</span>
<span class="timer-value" id="clockDisplay">10:00</span>
</div>
<div class="bio-respiration-dock">
<div class="lung-circle-master" id="lungCircle">Inhala</div>
</div>
<div id="txt-pulmon" style="text-align:center;font-size:12px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-bottom:20px;">Sincronización de Enfoque</div>
<div class="interactive-stack-container" id="interactiveStack"></div>
</div>

<div id="pantalla-cierre" class="hidden">
<div class="cierre-content">
<h1 style="font-family:'Cinzel',serif;color:var(--gold-champagne);font-size:22px;letter-spacing:4px;margin-bottom:15px;">MAY ROGA</h1>
<div id="cierre-message"></div>
<div id="cierre-timer">60</div>
<p id="cierre-mensaje-final" class="hidden"></p>
<button type="button" id="btn-recomenzar-experiencia" class="gold-action-btn hidden" onclick="location.reload();">Reiniciar Experiencia</button>
</div>
</div>

<button type="button" id="btn-volver-app" class="floating-btn hidden" onclick="location.reload();" title="Volver" aria-label="Volver">←</button>

<a id="btn-whatsapp" class="floating-btn hidden" href="https://wa.me/" target="_blank" rel="noopener noreferrer" title="WhatsApp" aria-label="WhatsApp">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="20" height="20" aria-hidden="true">
<path d="M12.04 2C6.58 2 2.11 6.47 2.11 11.93c0 1.73.48 3.33 1.33 4.7L2 22l5.61-1.39c1.37.85 2.97 1.33 4.7 1.33h-.27C17.5 21.94 21.97 17.47 21.97 12S17.5 2 12.04 2z"/>
</svg>
</a>

<a id="btn-messenger" class="floating-btn hidden" href="https://m.me/" target="_blank" rel="noopener noreferrer" title="Messenger" aria-label="Messenger">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="20" height="20" aria-hidden="true">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.06 15.65-3.04-6.45 6.26-4.85-3.22 11.3z"/>
</svg>
</a>

<script>
function cambiarIdiomaUI(lang){
if(!window.KERNEL||typeof KERNEL.cambiarIdioma!=='function')return;
document.getElementById('lang-es').classList.toggle('active',lang==='es');
document.getElementById('lang-en').classList.toggle('active',lang==='en');
document.documentElement.lang=lang;
KERNEL.cambiarIdioma(lang);
}
</script>

<script src="/static/engine.js"></script>

</body>
</html>
