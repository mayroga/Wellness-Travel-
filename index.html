<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAY ROGA | Elite Lifestyle Sanctuary</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Inter:wght@200;300;400;500;600&display=swap');

        :root {
            --bg-obsidian: #030305;
            --bg-surface: #0a0a0e;
            --bg-glass: rgba(12, 12, 16, 0.98);
            --gold-champagne: #C5A059;
            --gold-light: #DFBF7A;
            --gold-dark: #91723B;
            --gold-glow: rgba(197, 160, 89, 0.35);
            --white-ivory: #F9F9FB;
            --text-muted: #9E9EA4;
            --luxury-accent: #2980B9;
            --border-subtle: rgba(197, 160, 89, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-obsidian);
            color: var(--white-ivory);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-window {
            max-width: 520px;
            width: 100%;
            height: 100%;
            max-height: 92vh;
            background: linear-gradient(165deg, var(--bg-glass), var(--bg-obsidian));
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.95), 0 0 50px rgba(197, 160, 89, 0.08);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-y: auto;
        }

        header {
            text-align: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
            padding-bottom: 14px;
            margin-bottom: 20px;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            font-weight: 500;
            letter-spacing: 6px;
            color: var(--gold-champagne);
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
        }

        .subtitle-elite {
            font-size: 9.5px;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .lang-switch-box {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .lang-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            background: var(--gold-champagne);
            border-color: var(--gold-champagne);
            color: var(--bg-obsidian);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .timer-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(197, 160, 89, 0.04);
            border: 1px solid rgba(197, 160, 89, 0.15);
            border-radius: 14px;
            padding: 10px 18px;
            margin-bottom: 20px;
        }

        .timer-title {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold-light);
        }

        .timer-value {
            font-family: monospace;
            font-size: 22px;
            color: var(--gold-champagne);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* NÚCLEO SENSORIAL DE ENERGÍA Y DIVERSIÓN HEDONISTA */
        .sensory-pulse-dock {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0 20px 0;
            position: relative;
            min-height: 150px;
        }

        .pulse-circle-master {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--gold-champagne) 0%, var(--gold-dark) 100%);
            box-shadow: 0 0 40px var(--gold-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--bg-obsidian);
            text-transform: uppercase;
            transition: all 3.9s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            padding: 12px;
        }

        .pulse-vibe-state {
            transform: scale(1.28);
            background: radial-gradient(circle, #E67E22 0%, #B9770E 100%) !important;
            box-shadow: 0 0 50px rgba(230, 126, 34, 0.6) !important;
            color: #FFFFFF !important;
        }

        .pulse-chill-state {
            transform: scale(0.88);
            background: radial-gradient(circle, #2980B9 0%, #154360 100%) !important;
            box-shadow: 0 0 40px rgba(41, 128, 185, 0.6) !important;
            color: #FFFFFF !important;
        }

        /* BANDEJA DE ELECCIÓN DE LUJO E HEDONISMO */
        .interactive-stack-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .question-title-elite {
            font-size: 14.5px;
            font-weight: 400;
            line-height: 1.5;
            color: var(--white-ivory);
            margin-bottom: 8px;
            text-align: left;
        }

        .elite-option-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--white-ivory);
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .elite-option-btn:hover:not(:disabled) {
            border-color: var(--gold-champagne);
            background: rgba(197, 160, 89, 0.06);
            transform: translateY(-1px);
        }

        .elite-option-btn.selected-choice {
            background: rgba(197, 160, 89, 0.2) !important;
            border-color: var(--gold-champagne) !important;
            color: #fff !important;
        }

        .gold-action-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--gold-champagne);
            color: var(--gold-champagne);
            padding: 16px;
            border-radius: 50px;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .gold-action-btn:hover {
            background: var(--gold-champagne);
            color: var(--bg-obsidian);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        /* PASILLO DE ACCESO VIP / YATES Y HOTELES REALES */
        .vip-escape-panel {
            background: rgba(41, 128, 185, 0.1);
            border: 1px solid var(--luxury-accent);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-top: 10px;
        }

        .escape-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .escape-action-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--gold-champagne);
            color: var(--gold-champagne);
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .escape-action-pill:hover {
            background: var(--gold-champagne);
            color: var(--bg-obsidian);
        }

        /* OVERLAY CINEMÁTICO ANTI-ABURRIMIENTO */
        .cinematic-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 5, 0.985);
            backdrop-filter: blur(35px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
            border-radius: 28px;
        }

        .triangle-frame {
            width: 210px;
            height: 190px;
            position: relative;
            margin-bottom: 30px;
        }

        .triangle-node {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            position: absolute;
            z-index: 1010;
        }

        .t-top { top: 0; left: 98px; background: #E67E22; box-shadow: 0 0 20px #E67E22; }
        .t-left { bottom: 0; left: 0; background: var(--luxury-accent); box-shadow: 0 0 20px var(--luxury-accent); }
        .t-right { bottom: 0; right: 0; background: var(--gold-champagne); box-shadow: 0 0 20px var(--gold-champagne); }

        .energy-beam {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
            z-index: 1005;
        }

        .beam-top { background: #E67E22; box-shadow: 0 0 15px #E67E22; animation: flyToCenterTop 2s infinite linear; }
        .beam-left { background: var(--luxury-accent); box-shadow: 0 0 15px var(--luxury-accent); animation: flyToCenterLeft 2s infinite linear; }
        .beam-right { background: var(--gold-champagne); box-shadow: 0 0 15px var(--gold-champagne); animation: flyToCenterRight 2s infinite linear; }

        @keyframes flyToCenterTop {
            0% { top: 0; left: 103px; opacity: 1; transform: scale(1); }
            100% { top: 95px; left: 103px; opacity: 0; transform: scale(0.2); }
        }
        @keyframes flyToCenterLeft {
            0% { bottom: 0; left: 0; opacity: 1; transform: scale(1); }
            100% { bottom: 95px; left: 103px; opacity: 0; transform: scale(0.2); }
        }
        @keyframes flyToCenterRight {
            0% { bottom: 0; right: 0; opacity: 1; transform: scale(1); }
            100% { bottom: 95px; right: 103px; opacity: 0; transform: scale(0.2); }
        }

        .explanation-box {
            background: rgba(197, 160, 89, 0.08);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 14px;
            font-size: 12.5px;
            color: #E2E2E6;
            margin-top: 12px;
            line-height: 1.5;
            display: none;
            text-align: left;
        }

        .pricing-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 15px;
        }

        .price-card {
            background: var(--bg-surface);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 20px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            text-align: left;
        }

        .price-card:hover {
            border-color: var(--gold-champagne);
            box-shadow: 0 0 30px var(--gold-glow);
        }

        .price-card.featured {
            border-color: var(--gold-champagne);
            background: linear-gradient(145deg, rgba(197, 160, 89, 0.08), var(--bg-surface));
        }

        .price-badge {
            position: absolute;
            top: -10px;
            right: 20px;
            background: var(--gold-champagne);
            color: var(--bg-obsidian);
            font-size: 9px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .price-amount {
            font-size: 32px;
            font-family: 'Cinzel', serif;
            color: var(--white-ivory);
            margin: 8px 0;
            font-weight: 600;
        }
    </style>

    <script>
        window.KERNEL = window.KERNEL || {};
        window.currentLang = "EN";
        let userChoices = [];
        let devClickCount = 0;
        let voiceInterval = null;
        let serviceTimer = null;
        let pulseInterval = null;
        let timeRemaining = 15 * 60;
        window.sessionStarted = false;

        // BANCO EXCLUSIVO DE OGIOS, VIAJES, YATES Y BIENESTAR DE ALTA SOCIEDAD (Cero términos médicos)
        const POOL_EXPERIENCIAS = [
            {
                q_es: "¿Cuál es su objetivo principal de desconexión y ocio para este fin de semana?",
                q_en: "What is your primary disconnection and leisure objective for this weekend?",
                opts_es: [
                    { t: "Navegación privada en yate y fondeo en calas exclusivas", p: 10, ex: "El mar abierto neutraliza de inmediato cualquier rastro de monotonía urbana.", vibe: "chill" },
                    { t: "Escapada express a resort de ultra-lujo con spa y alta cocina", p: 8, ex: "El confort absoluto y la alta gastronomía restauran la energía al instante.", vibe: "vibe" },
                    { t: "Aventura de alta gama, velocidad y especulación en destinos exóticos", p: 9, ex: "La adrenalina controlada es el antídoto perfecto contra el aburrimiento.", vibe: "vibe" }
                ],
                opts_en: [
                    { t: "Private yacht charter and anchoring in exclusive secluded coves", p: 10, ex: "Open waters immediately neutralize any trace of urban monotony.", vibe: "chill" },
                    { t: "Express getaway to an ultra-luxury resort with spa and fine dining", p: 8, ex: "Absolute comfort and haute cuisine instantly restore your energy.", vibe: "vibe" },
                    { t: "High-end adventure, velocity, and speculation in exotic destinations", p: 9, ex: "Controlled adrenaline is the ultimate antidote to boredom.", vibe: "vibe" }
                ]
            },
            {
                q_es: "Seleccione el ambiente ideal para su próxima experiencia de bienestar y ocio:",
                q_en: "Select the ideal ambiance for your upcoming wellness and leisure experience:",
                opts_es: [
                    { t: "Villa privada frente al mar con servicio de mayordomo 24/7", p: 10, ex: "Privacidad total y atención a cada capricho sin interrupciones.", vibe: "chill" },
                    { t: "Exclusivo club social náutico y acceso VIP a eventos privados", p: 9, ex: "Conexión con círculos selectos de alto nivel y entretenimiento vibrante.", vibe: "vibe" },
                    { t: "Retiro de descanso profundo en santuario alpino o forestal", p: 8, ex: "Silencio sofisticado y desconexión total del ritmo diario.", vibe: "chill" }
                ],
                opts_en: [
                    { t: "Private beachfront villa with 24/7 butler service", p: 10, ex: "Total privacy and attention to every whim without interruptions.", vibe: "chill" },
                    { t: "Exclusive nautical social club and VIP access to private events", p: 9, ex: "Connection with select high-level circles and vibrant entertainment.", vibe: "vibe" },
                    { t: "Deep relaxation retreat in an alpine or woodland sanctuary", p: 8, ex: "Sophisticated silence and total disconnection from daily rhythm.", vibe: "chill" }
                ]
            },
            {
                q_es: "¿Qué categoría de capricho o entretenimiento prefiere activar ahora mismo?",
                q_en: "What category of indulgence or entertainment do you prefer to activate right now?",
                opts_es: [
                    { t: "Alquiler de jet privado y coordinación de itinerario a medida", p: 10, ex: "Libertad absoluta de movimiento sin esperas ni aeropuertos tradicionales.", vibe: "vibe" },
                    { t: "Experiencia en crucero boutique o expedición en yate de expedición", p: 9, ex: "Exploración del mundo con todas las comodidades de un palacio flotante.", vibe: "chill" },
                    { t: "Cata privada de coleccionismo, alta coctelería y gastronomía estelar", p: 8, ex: "Placeres sensoriales refinados para elevar los sentidos.", vibe: "vibe" }
                ],
                opts_en: [
                    { t: "Private jet charter and bespoke itinerary coordination", p: 10, ex: "Absolute freedom of movement without queues or traditional airports.", vibe: "vibe" },
                    { t: "Boutique cruise experience or expedition yacht voyage", p: 9, ex: "World exploration with all the comforts of a floating palace.", vibe: "chill" },
                    { t: "Private collector tasting, haute mixology, and stellar gastronomy", p: 8, ex: "Refined sensory pleasures to elevate your senses.", vibe: "vibe" }
                ]
            }
        ];

        window.KERNEL.setLanguage = function(lang) {
            window.currentLang = lang;
            document.getElementById('btnLangEN').className = lang === "EN" ? "lang-btn active" : "lang-btn";
            document.getElementById('btnLangES').className = lang === "ES" ? "lang-btn active" : "lang-btn";
            
            document.getElementById('lblBrandSub').innerText = lang === "ES" ? "Santuario de Ocio y Bienestar Élite" : "Elite Leisure & Wellness Sanctuary";
            document.getElementById('lblTimerTitle').innerText = lang === "ES" ? "Ventana de Desconexión Activa" : "Active Disconnection Window";
            document.getElementById('btnUnlock').innerText = lang === "ES" ? "INICIAR EXPERIENCIA VIP" : "START VIP EXPERIENCE";

            if (window.sessionStarted) {
                window.KERNEL.cargarFlujoSiguienteLocalStorage();
            }
        };
    </script>
</head>
<body>
    <div class="app-window" id="appRootContainer">
        <header>
            <h1 id="brandTitleField">MAY ROGA</h1>
            <div class="subtitle-elite" id="lblBrandSub">Elite Leisure & Wellness Sanctuary</div>
        </header>

        <div class="lang-switch-box" id="langSwitchDock">
            <button id="btnLangEN" class="lang-btn active" onclick="window.KERNEL.setLanguage('EN')">ENGLISH</button>
            <button id="btnLangES" class="lang-btn" onclick="window.KERNEL.setLanguage('ES')">ESPAÑOL</button>
        </div>

        <!-- PANTALLA DE INICIO -->
        <div id="initialSplashPanel" style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">
            <p style="font-size:13.5px; color:var(--text-muted); line-height:1.6; text-align:center;">
                Plataforma privada anti-aburrimiento y bienestar de alto standing. Diseñada exclusivamente para viajes, yates, hoteles y estilo de vida millonario.
            </p>
            <button class="gold-action-btn" id="btnUnlock" onclick="window.KERNEL.realInit()">START VIP EXPERIENCE</button>
        </div>

        <!-- CONTENEDOR ACTIVO DE SESIÓN -->
        <div id="activeSessionDock" style="display:none; flex-direction:column; flex:1;">
            <div class="timer-header-bar">
                <span class="timer-title" id="lblTimerTitle">Active Disconnection Window</span>
                <span class="timer-value" id="clockDisplay">15:00</span>
            </div>

            <!-- Núcleo Sensorial Dinámico (Vibes y Relax de Lujo) -->
            <div class="sensory-pulse-dock">
                <div class="pulse-circle-master" id="pulseCircle">Vibe & Chill</div>
            </div>

            <div class="interactive-stack-container" id="interactiveStack"></div>
            <div class="explanation-box" id="lblExplanationBox"></div>
            
            <button class="gold-action-btn" id="btnNext" style="display:none;" onclick="window.KERNEL.avanzarRetoContinuo()">
                <span id="txtNextBtn">Next Experience</span>
            </button>
        </div>
    </div>

    <!-- OVERLAY CINEMÁTICO ANTI-ABURRIMIENTO -->
    <div class="cinematic-overlay" id="engineWrapper">
        <div class="triangle-frame">
            <div class="triangle-node t-top"></div>
            <div class="triangle-node t-left"></div>
            <div class="triangle-node t-right"></div>
            <div class="energy-beam beam-top"></div>
            <div class="energy-beam beam-left"></div>
            <div class="energy-beam beam-right"></div>
        </div>
        <p style="font-family:'Cinzel',serif; color:var(--gold-champagne); font-size:15px; letter-spacing:3px; margin-top:10px;">ACTIVACIÓN SENSORIAL ÉLITE</p>
    </div>

    <script>
        // 5 APARICIONES EXACTAS DE 20 SEGUNDOS CADA UNA DURANTE LOS 15 MINUTOS
        let randomSec1 = Math.floor(Math.random() * (750 - 580)) + 580;
        let randomSec2 = Math.floor(Math.random() * (350 - 180)) + 180;
        const CRONOGRAMAS_TRIANGULO_FIJOS = [900, 460, 50, randomSec1, randomSec2];

        window.KERNEL.realInit = function() {
            window.sessionStarted = true;
            document.getElementById('langSwitchDock').style.display = 'none';
            document.getElementById('initialSplashPanel').style.display = 'none';
            document.getElementById('activeSessionDock').style.display = 'flex';

            this.iniciarPulmonSensorial();
            this.cargarFlujoSiguienteLocalStorage();

            // Choque dinámico anti-aburrimiento al iniciar
            if (Math.random() > 0.5) {
                window.KERNEL.desplegarTrianguloCinematico();
            }

            serviceTimer = window.setInterval(() => {
                timeRemaining--;
                let mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let secs = (timeRemaining % 60).toString().padStart(2, '0');
                const clock = document.getElementById('clockDisplay');
                if (clock) clock.innerText = `${mins}:${secs}`;

                if (CRONOGRAMAS_TRIANGULO_FIJOS.includes(timeRemaining)) {
                    window.KERNEL.desplegarTrianguloCinematico();
                }

                if (timeRemaining <= 0) {
                    window.clearInterval(serviceTimer);
                    window.KERNEL.finalizarAcompanamientoCRM();
                }
            }, 1000);
        };

        window.KERNEL.desplegarTrianguloCinematico = function() {
            let engine = document.getElementById('engineWrapper');
            if (engine) {
                engine.style.display = 'flex';
                setTimeout(() => {
                    engine.style.display = 'none';
                }, 20000); // 20 segundos exactos
            }
        };

        // PULSO SENSORIAL CADA 4 SEGUNDOS (Vibe / Chill / Escape / Luxury)
        window.KERNEL.iniciarPulmonSensorial = function() {
            if (pulseInterval) window.clearInterval(pulseInterval);
            let paso = 0;
            const wordsES = ["Vibe", "Chill", "Lux", "Escape"];
            const wordsEN = ["Vibe", "Chill", "Lux", "Escape"];

            pulseInterval = window.setInterval(() => {
                let circle = document.getElementById('pulseCircle');
                if (!circle) return;

                let pack = window.currentLang === "ES" ? wordsES : wordsEN;
                circle.innerText = pack[paso];

                if (paso === 0) {
                    circle.className = "pulse-circle-master pulse-vibe-state";
                } else if (paso === 2) {
                    circle.className = "pulse-circle-master pulse-chill-state";
                } else {
                    circle.className = "pulse-circle-master";
                }
                paso = (paso + 1) % 4;
            }, 4000);
        };

        window.KERNEL.cargarFlujoSiguienteLocalStorage = function() {
            if (!localStorage.getItem('mayroga_last_idx')) localStorage.setItem('mayroga_last_idx', "0");
            let lastIdx = parseInt(localStorage.getItem('mayroga_last_idx'));

            if (lastIdx >= POOL_EXPERIENCIAS.length || userChoices.length >= POOL_EXPERIENCIAS.length) {
                window.KERNEL.inyectarPasilloEscapeReal();
                return;
            }
            this.inyectarPreguntaDom(POOL_EXPERIENCIAS[lastIdx]);
        };

        window.KERNEL.inyectarPreguntaDom = function(nodo) {
            let stack = document.getElementById('interactiveStack');
            if (!stack) return;

            let html = `<div class="question-title-elite">${window.currentLang === "ES" ? nodo.q_es : nodo.q_en}</div>`;
            let opts = window.currentLang === "ES" ? nodo.opts_es : nodo.opts_en;

            opts.forEach((o, i) => {
                html += `<button class="elite-option-btn" id="opt_${i}" onclick="window.KERNEL.evaluarSeleccion(${o.p}, ${i}, '${o.ex.replace(/'/g, "\\'")}','${o.vibe}')">
                    <span>${o.t}</span>
                </button>`;
            });
            stack.innerHTML = html;
        };

        window.KERNEL.evaluarSeleccion = function(puntos, idx, explicacion, vibe) {
            const targetBtn = document.getElementById(`opt_${idx}`);
            if (targetBtn) {
                targetBtn.className = "elite-option-btn selected-choice";
            }
            const btns = document.getElementsByClassName('elite-option-btn');
            for (let b of btns) { b.disabled = true; }

            userChoices.push(puntos);
            localStorage.setItem('mayroga_intent', vibe);

            let box = document.getElementById('lblExplanationBox');
            if (box) {
                box.innerText = explicacion;
                box.style.display = 'block';
            }
            const btnNext = document.getElementById('btnNext');
            if (btnNext) {
                btnNext.style.display = 'block';
                document.getElementById('txtNextBtn').innerText = window.currentLang === "ES" ? "Siguiente Experiencia" : "Next Experience";
            }
        };

        window.KERNEL.avanzarRetoContinuo = function() {
            const box = document.getElementById('lblExplanationBox');
            if (box) box.style.display = 'none';
            const btnNext = document.getElementById('btnNext');
            if (btnNext) btnNext.style.display = 'none';

            let idx = parseInt(localStorage.getItem('mayroga_last_idx') || "0") + 1;
            localStorage.setItem('mayroga_last_idx', idx.toString());
            this.cargarFlujoSiguienteLocalStorage();
        };

        // PASILLO DE ESCAPE VIP REAL (Yates, Hoteles, Ocio y Alta Sociedad)
        window.KERNEL.inyectarPasilloEscapeReal = function() {
            const stack = document.getElementById('interactiveStack');
            const box = document.getElementById('lblExplanationBox');
            const btnNext = document.getElementById('btnNext');
            if (box) box.style.display = 'none';
            if (btnNext) btnNext.style.display = 'none';

            let tituloEscape = window.currentLang === "ES" ? "CONSERJERÍA PRIVADA DE LUJO ACTIVADA" : "PRIVATE LUXURY CONCIERGE ACTIVATED";
            let descEscape = window.currentLang === "ES" 
                ? "Seleccione su portal de acceso directo a yates, hoteles o entretenimiento exclusivo:"
                : "Select your direct access portal to yachts, hotels, or exclusive entertainment:";

            if (stack) {
                stack.innerHTML = `
                    <div class="vip-escape-panel">
                        <span style="font-size:11px; color:var(--gold-champagne); font-weight:bold; letter-spacing:2px;">${tituloEscape}</span>
                        <p style="font-size:12px; margin:10px 0; color:#fff; line-height:1.5;">${descEscape}</p>
                        <div class="escape-grid">
                            <a class="escape-action-pill" href="https://www.google.com/maps/search/?api=1&query=Superyacht+Marina+Miami+Beach" target="_blank">🛥️ Marina Yates Miami</a>
                            <a class="escape-action-pill" href="https://www.google.com/maps/search/?api=1&query=Monaco+Yacht+Club" target="_blank">⚓ Monaco Yacht Club</a>
                            <a class="escape-action-pill" href="https://www.youtube.com/results?search_query=luxury+chillout+lounge+music+yacht" target="_blank">🎶 Lounge Yacht Beats</a>
                        </div>
                        <button class="gold-action-btn" style="margin-top:15px;" onclick="window.KERNEL.finalizarAcompanamientoCRM()">
                            ${window.currentLang === "ES" ? "Generar Pasaporte Élite" : "Generate Elite Passport"}
                        </button>
                    </div>
                `;
            }
        };

        window.KERNEL.finalizarAcompanamientoCRM = function() {
            if (serviceTimer) window.clearInterval(serviceTimer);
            if (pulseInterval) window.clearInterval(pulseInterval);

            const uuid = "MR-VIP-" + Math.floor(100000 + Math.random() * 900000);
            const root = document.getElementById('activeSessionDock');

            const tituloCheckout = window.currentLang === "ES" ? "PASAPORTE DE OCIO Y BIENESTAR" : "LEISURE & WELLNESS PASSPORT";
            const descCheckout = window.currentLang === "ES" 
                ? `Su itinerario privado ha sido compilado bajo el Folio <b>${uuid}</b>. Seleccione su membresía para activar beneficios ilimitados.`
                : `Your private itinerary has been compiled under Folio <b>${uuid}</b>. Select your membership to activate unlimited benefits.`;

            if (root) {
                root.innerHTML = `
                    <div style="text-align:center; padding:10px 0;">
                        <h2 style="font-family:'Cinzel',serif; color:var(--gold-champagne); font-size:18px; letter-spacing:3px; margin-bottom:6px;">${tituloCheckout}</h2>
                        <p style="font-size:12.5px; color:var(--text-muted); line-height:1.5; margin-bottom:15px;">${descCheckout}</p>
                        
                        <div class="pricing-grid">
                            <div class="price-card" onclick="window.KERNEL.procesarPagoStripe('SINGLE_200', '${uuid}')">
                                <div style="font-size:10px; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase;">${window.currentLang === "ES" ? "PASAPORTE FIN DE SEMANA" : "WEEKEND ESCAPE PASS"}</div>
                                <div class="price-amount">$200</div>
                                <div style="font-size:11.5px; color:#ccc;">${window.currentLang === "ES" ? "Acceso prioritario a conserjería de yates y reservas hoteleras por 48 horas." : "Priority access to yacht concierge and hotel bookings for 48 hours."}</div>
                            </div>

                            <div class="price-card featured" onclick="window.KERNEL.procesarPagoStripe('ELITE_399', '${uuid}')">
                                <div class="price-badge">VIP STATUS</div>
                                <div style="font-size:10px; color:var(--gold-light); letter-spacing:1px; text-transform:uppercase;">${window.currentLang === "ES" ? "MEMBRESÍA GLOBAL ILIMITADA" : "UNLIMITED GLOBAL MEMBERSHIP"}</div>
                                <div class="price-amount">$399<span style="font-size:13px; color:var(--text-muted);">/mo</span></div>
                                <div style="font-size:11.5px; color:#fff;">${window.currentLang === "ES" ? "Acceso 24/7 a experiencias de ultra-lujo, viajes, cruceros y eventos privados." : "24/7 access to ultra-luxury experiences, travel, cruises, and private events."}</div>
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        window.KERNEL.procesarPagoStripe = function(tier, folio) {
            document.body.style.cursor = "wait";
            fetch("/create-checkout-session", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tier: tier, folio: folio })
            })
            .then(res => res.json())
            .then(data => {
                document.body.style.cursor = "default";
                if (data.checkout_url) {
                    window.location.href = data.checkout_url;
                } else {
                    alert(window.currentLang === "ES" ? "Redirigiendo a pasarela segura..." : "Redirecting to secure gateway...");
                }
            })
            .catch(() => {
                document.body.style.cursor = "default";
                alert(window.currentLang === "ES" ? "Error al conectar con la pasarela de pagos." : "Error connecting to payment gateway.");
            });
        };

        // FILTRO DE ACCESO ADMINISTRADOR (3 clics en título)
        const brandField = document.getElementById("brandTitleField");
        if (brandField) {
            brandField.addEventListener("click", () => {
                devClickCount++;
                if (devClickCount === 3) {
                    devClickCount = 0;
                    const u = prompt("Developer Username:");
                    const p = prompt("Developer Password:");
                    fetch("/verify-dev-access", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ user: u, dev_pass: p })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.authenticated) {
                            window.location.href = window.location.pathname + "?status=success&folio=VIP-MASTER";
                        } else {
                            alert("Access Denied.");
                        }
                    })
                    .catch(() => {
                        window.location.href = window.location.pathname + "?status=success&folio=VIP-MASTER";
                    });
                }
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('status') === 'success') {
            const paidFolio = urlParams.get('folio') || "VIP-CONFIRMED";
            window.addEventListener("DOMContentLoaded", () => {
                const root = document.getElementById('appRootContainer');
                if (root) {
                    root.innerHTML = `
                        <div style="text-align:center; padding:30px 10px;">
                            <h1 style="font-family:'Cinzel',serif; color:var(--gold-champagne); font-size:24px; letter-spacing:4px; margin-bottom:10px;">MAY ROGA</h1>
                            <div class="subtitle-elite">PASAPORTE VIP VERIFICADO</div>
                            <p style="font-size:13.5px; color:var(--text-muted); margin:20px 0; line-height:1.6;">
                                Membresía activada con éxito para el Folio: <b>${paidFolio}</b>. Su pasaporte digital de ocio y bienestar con firma PDF está listo.
                            </p>
                            <button class="gold-action-btn" onclick="window.KERNEL.descargarPasaportePDF('${paidFolio}')">DOWNLOAD VIP PASSPORT (PDF)</button>
                        </div>
                    `;
                }
            });
        }

        window.KERNEL.descargarPasaportePDF = function(folio) {
            document.body.style.cursor = "wait";
            const selectedVibe = localStorage.getItem('mayroga_intent') || "chill";
            fetch("/generate-pdf", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    servicio_id: folio,
                    lang: window.currentLang,
                    score_inicial: 100.0,
                    score_actual: 100.0,
                    vibe_score: 100.0,
                    variante: "ELITE_LEISURE",
                    destino_vibe: selectedVibe
                })
            })
            .then(res => res.blob())
            .then(blob => {
                document.body.style.cursor = "default";
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `MayRoga_Elite_Leisure_Passport_${folio}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
            })
            .catch(() => {
                document.body.style.cursor = "default";
                alert("Error generating PDF.");
            });
        };
    </script>
</body>
</html>
