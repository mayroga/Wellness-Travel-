<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAY ROGA | Premium Travel Architecture</title>
    <!-- ANALÍTICA ANÓNIMA Y PRIVADA (PLAUSIBLE) -->
    <script defer data-domain="tu-dominio-mayroga.com" src="https://plausible.io"></script>
    <script>
        window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap');

        :root {
            --bg-obsidian: #030305;
            --bg-matte-black: #050505;
            --bg-surface-dark: #0a0a0e;
            --luxury-card: #0a0a0e;
            --gold-champagne: #C5A059;
            --gold-primary: #A3704C;
            --gold-glow: rgba(197, 160, 89, 0.4);
            --gold-light: #C5A084;
            --white-ivory: #FFFFFF;
            --text-pure: #FFFFFF;
            --text-muted: #8E8E93;
            --text-dark: #222222;
            --wellness-green: #3D9970;
            --relax-blue: #1C3D5A;
            --alert-crimson: #E04F4F;
            --red-alert-base: #C0392B;
            --red-alert-glow: rgba(192, 57, 43, 0.4);
            --glass-background: rgba(15, 15, 18, 0.95);
            --glass-border: rgba(255, 255, 255, 0.06);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-obsidian);
            color: var(--white-ivory);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
        }
        .app-window {
            max-width: 460px;
            width: 100%;
            background: linear-gradient(145deg, rgba(15, 15, 18, 0.99), rgba(3, 3, 5, 1));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 32px;
            padding: 40px 28px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.95), 0 0 60px rgba(197, 160, 89, 0.04);
            position: relative;
            overflow: hidden;
        }
        header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        header h1 {
            font-size: 28px;
            font-weight: 200;
            letter-spacing: 7px;
            color: var(--gold-champagne);
            text-transform: uppercase;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            cursor: pointer;
        }
        .lang-container-giant {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .giant-lang-btn {
            flex: 1;
            background: rgba(255,255,255,0.01);
            border: 2px solid var(--gold-champagne);
            color: var(--gold-champagne);
            padding: 20px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .giant-lang-btn:active, .giant-lang-btn.active-lang {
            background: var(--gold-champagne);
            color: var(--bg-obsidian);
            box-shadow: 0 0 20px var(--gold-glow);
        }
        h2 {
            font-size: 19px;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            line-height: 1.4;
            text-align: center;
            color: var(--white-ivory);
        }
        p {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 24px;
            text-align: center;
        }
        .gold-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--gold-champagne);
            color: var(--gold-champagne);
            padding: 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .gold-btn:hover, .gold-btn:active {
            background: var(--gold-champagne);
            color: var(--bg-obsidian);
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .timeline-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }
        .timer-display {
            font-size: 34px;
            font-family: "SF Mono", Consolas, monospace;
            font-weight: 200;
            color: var(--alert-crimson);
            text-shadow: 0 0 15px rgba(224, 79, 79, 0.4);
        }
        .triple-option-btn {
            width: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--white-ivory);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 400;
            margin-bottom: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .triple-option-btn:hover {
            border-color: var(--gold-champagne);
            background: rgba(197, 160, 89, 0.05);
        }
        .correct-choice {
            background: rgba(61, 153, 112, 0.2) !important;
            border-color: var(--wellness-green) !important;
            color: #fff !important;
        }
        .wrong-choice {
            background: rgba(224, 79, 79, 0.2) !important;
            border-color: var(--alert-crimson) !important;
            color: #fff !important;
        }
        .luxury-checkout-dock {
            text-align: center;
            padding: 10px 0;
        }
        .premium-pricing-deck {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        .luxury-card-price {
            background: var(--luxury-card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            position: relative;
        }
        .luxury-card-price:hover {
            border-color: var(--gold-champagne);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.15);
        }
        .tier-card-elite {
            border-color: var(--gold-champagne);
            background: linear-gradient(145deg, rgba(197, 160, 89, 0.05), rgba(10, 10, 14, 1));
        }
        .card-ribbon-gold {
            position: absolute;
            top: -10px;
            right: 20px;
            background: var(--gold-champagne);
            color: var(--bg-obsidian);
            font-size: 9px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .premium-portal-panel {
            background: rgba(28, 61, 90, 0.15);
            border: 1px solid var(--relax-blue);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-top: 15px;
        }
        .portal-mini-btn {
            display: inline-block;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--gold-champagne);
            color: var(--gold-champagne);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .portal-mini-btn:hover {
            background: var(--gold-champagne);
            color: var(--bg-obsidian);
        }

        /* OVERLAY TEATRAL CINEMÁTICO */
        .graphics-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 5, 0.97);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: all 0.5s ease;
            text-align: center;
        }
        .triangle-canvas {
            width: 220px;
            height: 190px;
            position: relative;
            margin-bottom: 30px;
        }
        .vertex-node {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            position: absolute;
            z-index: 1100;
        }
        .v-top { top: 0; left: 103px; background-color: var(--alert-crimson); box-shadow: 0 0 20px var(--alert-crimson); }
        .v-left { bottom: 0; left: 0; background-color: var(--relax-blue); box-shadow: 0 0 20px var(--relax-blue); }
        .v-right { bottom: 0; right: 0; background-color: var(--gold-champagne); box-shadow: 0 0 20px var(--gold-champagne); }

        .energy-beam { position: absolute; width: 6px; height: 6px; border-radius: 50%; opacity: 0; }
        .beam-top { background: var(--alert-crimson); box-shadow: 0 0 15px var(--alert-crimson); animation: flyToCenterTop 2.5s infinite linear; }
        .beam-left { background: var(--relax-blue); box-shadow: 0 0 15px var(--relax-blue); animation: flyToCenterLeft 2.5s infinite linear; }
        .beam-right { background: var(--gold-champagne); box-shadow: 0 0 15px var(--gold-champagne); animation: flyToCenterRight 2.5s infinite linear; }

        @keyframes flyToCenterTop { 0% { top: 0; left: 110px; opacity: 1; transform: scale(1); } 100% { top: 300px; left: 110px; opacity: 0; transform: scale(0.1); } }
        @keyframes flyToCenterLeft { 0% { bottom: 0; left: 0; opacity: 1; transform: scale(1); } 100% { bottom: -120px; left: 110px; opacity: 0; transform: scale(0.1); } }
        @keyframes flyToCenterRight { 0% { bottom: 0; right: 0; opacity: 1; transform: scale(1); } 100% { bottom: -120px; right: 110px; opacity: 0; transform: scale(0.1); } }

        .center-wellness-circle { width: 95px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #C5A059 0%, #91723B 100%); box-shadow: 0 0 45px var(--gold-champagne); z-index: 10; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; color: #030305; letter-spacing: 1.5px; text-transform: uppercase; transition: all 4s linear; }
        .lung-inhale { width: 170px; height: 170px; background: radial-gradient(circle, #1C3D5A 0%, #0B1D33 100%) !important; box-shadow: 0 0 60px rgba(28,61,90,1) !important; color: #FFFFFF !important; }
        .lung-exhale { width: 80px; height: 80px; background: radial-gradient(circle, #E04F4F 0%, #992222 100%) !important; box-shadow: 0 0 35px rgba(224,79,79,0.7) !important; color: #FFFFFF !important; }
    </style>
    
    <script>
        window.KERNEL = window.KERNEL || {};
        window.currentLang = "ES";
        let userAnswers = [];
        let detectedMood = "neutral";
        let devClickCount = 0;
        let voiceInterval = null;

        const VOCABULARIO_SABIDURIA = {
            es: ["La pausa es la llave maestra de la estrategia.", "Respira con calma, el control absoluto reside en ti.", "Cada paso de sintonía consolida tu claridad ejecutiva."],
            en: ["The pause is the master key of strategy.", "Breathe calmly, absolute control resides within you.", "Each tuning step consolidates your executive clarity."]
        };

        const VOCABULARIO_MUTANTE = {
            es: {
                neutral: ["Mantén el ritmo constante.", "Analiza el entorno con precisión."],
                ansioso: ["Suelta la tensión de los hombros.", "Inhala serenidad, exhala el ruido externo."]
            },
            en: {
                neutral: ["Maintain a steady rhythm.", "Analyze the environment with precision."],
                ansioso: ["Release the tension in your shoulders.", "Inhale serenity, exhale external noise."]
            }
        };

        const POOL_EJERCICIOS = [
            {
                q_es: "¿Cuál es tu prioridad principal de enfoque en este momento operativo?",
                q_en: "What is your primary focus priority at this operational moment?",
                opts_es: [
                    { t: "Desconexión total e inmediata del entorno", p: 10, c: true, ex: "Priorizar el aislamiento limpia los canales cognitivos.", mood: "ansioso" },
                    { t: "Gestión de tareas pendientes bajo presión", p: 5, c: false, ex: "La presión constante requiere una tregua estructurada.", mood: "neutral" }
                ],
                opts_en: [
                    { t: "Total and immediate disconnection from environment", p: 10, c: true, ex: "Prioritizing isolation clears cognitive channels.", mood: "ansioso" },
                    { t: "Pending task management under pressure", p: 5, c: false, ex: "Constant pressure requires a structured truce.", mood: "neutral" }
                ]
            }
        ];

        window.KERNEL.setLanguage = function(lang) {
            window.currentLang = lang;
            document.getElementById('btnLangES').className = lang === "ES" ? "giant-lang-btn active-lang" : "giant-lang-btn";
            document.getElementById('btnLangEN').className = lang === "EN" ? "giant-lang-btn active-lang" : "giant-lang-btn";
            document.getElementById('lblLegalTitle').innerText = lang === "ES" ? "Tu espacio privado de sintonía" : "Your private tuning residency";
            const btnUnlock = document.getElementById('btnUnlock');
            if (btnUnlock) btnUnlock.innerText = lang === "ES" ? "INICIAR" : "START";
            document.getElementById('panelLegal').style.display = 'block';
        };
    </script>
</head>
<body>
    <div class="app-window" id="open-than-go-root">
        <header><h1 id="brandTitleField">MAY ROGA</h1></header>
        
        <div class="lang-container-giant" id="giantLangBox">
            <button id="btnLangES" class="giant-lang-btn active-lang" onclick="window.KERNEL.setLanguage('ES')">ESPAÑOL</button>
            <button id="btnLangEN" class="giant-lang-btn" onclick="window.KERNEL.setLanguage('EN')">ENGLISH</button>
        </div>
        
        <h2 id="lblLegalTitle">Tu espacio privado de sintonía</h2>
        
        <div id="panelLegal" style="display:block; text-align:center;">
            <button class="gold-btn" id="btnUnlock" onclick="window.KERNEL.realInit()">INICIAR</button>
            <div class="timeline-bar">
                <div class="timer-display" id="clockDisplay">15:00</div>
            </div>
            <div id="lblTaskTitle" style="font-size:14px; font-weight:400; color:#fff; margin-bottom:15px;"></div>
            <div id="interactiveStack"></div>
            <div id="lblExplanationBox" style="display:none; background:rgba(197,160,89,0.1); border:1px solid var(--gold-champagne); border-radius:12px; padding:12px; font-size:12px; color:#ddd; margin:15px 0; text-align:left;"></div>
            <button class="gold-btn" id="btnNext" style="display:none; margin-top:15px;" onclick="window.KERNEL.avanzarRetoContinuo()">Siguiente Sintonía</button>
            <p id="lblStatus" style="margin-top:15px;">Alineando Frecuencias del Enfoque</p>
        </div>
    </div>

    <!-- CONTENEDOR DEL TRIÁNGULO CINEMÁTICO -->
    <div class="graphics-container" id="engineWrapper">
        <div class="triangle-canvas">
            <div class="vertex-node v-top"></div>
            <div class="vertex-node v-left"></div>
            <div class="vertex-node v-right"></div>
            <div class="energy-beam beam-top"></div>
            <div class="energy-beam beam-left"></div>
            <div class="energy-beam beam-right"></div>
        </div>
        <div class="center-wellness-circle" id="lungCircle">Inicia</div>
    </div>
   <script>
        let serviceTimer = null, breatheInterval = null;
        let timeRemaining = 15 * 60;

        let randomSec1 = Math.floor(Math.random() * (780 - 540)) + 540;
        let randomSec2 = Math.floor(Math.random() * (360 - 120)) + 120;
        const CRONOGRAMA_TRIANGULO = [900, 460, 50, randomSec1, randomSec2];

        window.KERNEL.realInit = function() {
            const giantBox = document.getElementById('giantLangBox');
            if (giantBox) giantBox.style.display = 'none';
            
            const btnUnlock = document.getElementById('btnUnlock');
            if (btnUnlock) btnUnlock.style.display = 'none';
            
            const legalTitle = document.getElementById('lblLegalTitle');
            if (legalTitle) legalTitle.style.display = 'none';

            const statusLbl = document.getElementById('lblStatus');
            if (statusLbl) statusLbl.style.display = 'none';

            this.iniciarPulmonVisual();
            this.cargarFlujoSiguienteLocalStorage();

            if (Math.random() > 0.5) {
                window.KERNEL.desplegarTrianguloCinematico();
            }

            serviceTimer = window.setInterval(() => {
                timeRemaining--;
                
                let mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
                let secs = (timeRemaining % 60).toString().padStart(2, '0');
                const clock = document.getElementById('clockDisplay');
                if (clock) clock.innerText = `${mins}:${secs}`;

                if (typeof CRONOGRAMA_TRIANGULO !== 'undefined' && CRONOGRAMA_TRIANGULO.includes(timeRemaining)) {
                    window.KERNEL.desplegarTrianguloCinematico();
                }

                if (timeRemaining <= 0) {
                    window.clearInterval(serviceTimer);
                    window.KERNEL.finalizarAcompanamientoCRM();
                }
            }, 1000);
        };

        window.KERNEL.desplegarTrianguloCinematico = function() {
            let engine = document.getElementById('engineWrapper');
            if (engine) {
                engine.style.display = 'flex';
                setTimeout(() => {
                    engine.style.display = 'none';
                }, 20000);
            }
        };

        window.KERNEL.iniciarPulmonVisual = function() {
            if (breatheInterval) window.clearInterval(breatheInterval);
            let pasoSincronizado = 0;
            const ordenInstrucciones = window.currentLang === "ES"
                ? ["Inhala", "Retén", "Exhala", "Pausa"]
                : ["Inhale", "Hold", "Exhale", "Pause"];

            breatheInterval = window.setInterval(() => {
                let circle = document.getElementById('lungCircle');
                if (!circle) return;

                circle.innerText = ordenInstrucciones[pasoSincronizado];
                if (pasoSincronizado === 0) {
                    circle.className = "center-wellness-circle lung-inhale";
                } else if (pasoSincronizado === 2) {
                    circle.className = "center-wellness-circle lung-exhale";
                }
                pasoSincronizado = (pasoSincronizado + 1) % 4;
            }, 4000);
        };

        window.KERNEL.cargarFlujoSiguienteLocalStorage = function() {
            if (!localStorage.getItem('mayroga_last_idx')) localStorage.setItem('mayroga_last_idx', "0");
            let lastIdx = parseInt(localStorage.getItem('mayroga_last_idx'));
            if (lastIdx >= POOL_EJERCICIOS.length || userAnswers.length >= 3) {
                const stack = document.getElementById('interactiveStack');
                if (stack) stack.innerHTML = `<p style="color:#C5A059; text-align:center; font-size:13px; letter-spacing:1px; text-transform:uppercase;">Sintonía en progreso. Sigue el pulmón biológico.</p>`;
                window.KERNEL.inyectarPortalInteractivodeEscape();
                return;
            }
            this.inyectarPreguntaDom(POOL_EJERCICIOS[lastIdx]);
        };

        window.KERNEL.inyectarPreguntaDom = function(nodo) {
            let stack = document.getElementById('interactiveStack');
            const taskTitle = document.getElementById('lblTaskTitle');
            if (taskTitle) taskTitle.innerText = window.currentLang === "ES" ? nodo.q_es : nodo.q_en;
            let html = "";
            let opts = window.currentLang === "ES" ? nodo.opts_es : nodo.opts_en;
            opts.forEach((o, i) => {
                html += `<button class="triple-option-btn" id="opt_${i}" onclick="window.KERNEL.evaluarSeleccion(${o.p}, ${i}, ${o.c}, '${o.ex.replace(/'/g, "\\'")}', '${o.mood || ''}')">${o.t}</button>`;
            });
            if (stack) stack.innerHTML = html;
        };

        window.KERNEL.evaluarSeleccion = function(puntos, idx, esCorrecto, explicacion, moodElegido) {
            const targetBtn = document.getElementById(`opt_${idx}`);
            if (targetBtn) {
                targetBtn.className = esCorrecto ? "triple-option-btn correct-choice" : "triple-option-btn wrong-choice";
            }
            const btns = document.getElementsByClassName('triple-option-btn');
            for (let b of btns) { b.disabled = true; }
            if (moodElegido) { 
                detectedMood = moodElegido; 
                this.hablar(); 
            }
            userAnswers.push(puntos);
            let box = document.getElementById('lblExplanationBox');
            if (box) { 
                box.innerText = explicacion; 
                box.style.display = 'block'; 
            }
            const btnNext = document.getElementById('btnNext');
            if (btnNext) btnNext.style.display = 'block';
        };

        window.KERNEL.avanzarRetoContinuo = function() {
            const box = document.getElementById('lblExplanationBox');
            if (box) box.style.display = 'none';
            const btnNext = document.getElementById('btnNext');
            if (btnNext) btnNext.style.display = 'none';
            let idx = parseInt(localStorage.getItem('mayroga_last_idx') || "0") + 1;
            localStorage.setItem('mayroga_last_idx', idx.toString());
            this.cargarFlujoSiguienteLocalStorage();
        };

        window.KERNEL.inyectarPortalInteractivodeEscape = function() {
            const trayDock = document.getElementById('interactiveStack');
            if (trayDock) {
                trayDock.innerHTML = `
                    <div class="premium-portal-panel">
                        <span style="font-size:11px; color:#E04F4F; font-weight:bold; letter-spacing:2px;">PASILLO DE ACCESO VIP ACTIVADO</span>
                        <p style="font-size:12px; margin:12px 0; color:#fff; line-height:1.5;">Coherencia cardíaca lograda. Selecciona tu ubicación física de escape:</p>
                        <div style="display:flex; gap:12px; justify-content:center; margin-top:15px;">
                            <span class="portal-mini-btn" onclick="localStorage.setItem('mayroga_intent','H1'); window.open('https://google.com', '_blank');">🏨 Ver Eden Roc</span>
                            <span class="portal-mini-btn" onclick="localStorage.setItem('mayroga_intent','H2'); window.open('https://google.com', '_blank');">🏖️ Ver Amanera</span>
                        </div>
                    </div>
                `;
            }
        };

        window.KERNEL.hablar = function() {
            if (voiceInterval) window.clearInterval(voiceInterval);
            let count = 0;
            const emitirVozOasis = () => {
                if ('speechSynthesis' in window) {
                    let frase = "";
                    count++;
                    if (count % 3 === 0) {
                        let poolS = VOCABULARIO_SABIDURIA[window.currentLang.toLowerCase()];
                        frase = poolS[Math.floor(Math.random() * poolS.length)];
                    } else {
                        let poolM = VOCABULARIO_MUTANTE[window.currentLang.toLowerCase()][detectedMood];
                        frase = poolM[Math.floor(Math.random() * poolM.length)];
                    }
                    let utterance = new SpeechSynthesisUtterance(frase);
                    utterance.lang = window.currentLang === "ES" ? "es-US" : "en-US";
                    window.speechSynthesis.speak(utterance);
                }
            };
            emitirVozOasis();
            voiceInterval = window.setInterval(emitirVozOasis, 15000);
        };

        window.KERNEL.finalizarAcompanamientoCRM = function() {
            if (serviceTimer) window.clearInterval(serviceTimer);
            if (breatheInterval) window.clearInterval(breatheInterval);
            if (voiceInterval) window.clearInterval(voiceInterval);
            const uuid = "MR-" + Math.floor(100000 + Math.random() * 900000);
            const targetRoot = document.getElementById('open-than-go-root');
            if (targetRoot) {
                targetRoot.innerHTML = `
                    <div class="luxury-checkout-dock"> 
                        <h1 style="font-family:'Times New Roman',serif; color:#C5A059; font-size:32px; margin-bottom:4px; letter-spacing:4px;">MAY ROGA</h1> 
                        <div style="font-size:10px; color:#8E8E93; letter-spacing:3px; text-transform:uppercase; margin-bottom:24px;">WELLNESS TRAVEL ARCHITECTURE</div> 
                        <p style="font-size:14px; text-align:justify; margin-bottom:25px; line-height:1.6; color:#E1E1E1;"> Tu pasaporte Élite ha sido compilado de forma privada bajo el Folio <b>${uuid}</b>. Prescribimos aislamiento inmediato en nuestros oasis premium para romper de raíz el desgaste del ruido operativo diario. </p> 
                        <div class="premium-pricing-deck"> 
                            <div onclick="window.KERNEL.procesarPagoStripe('SINGLE_200', '${uuid}')" class="luxury-card-price"> 
                                <div style="font-size:11px; color:#888; text-transform:uppercase; letter-spacing:1px;">PAGO ÚNICO (SINGLE RESET)</div> 
                                <div style="font-size:32px; font-weight:bold; margin:6px 0; color:#fff;">$200</div> 
                                <p style="font-size:11.5px; color:#aaa; margin:0; line-height:1.4;">Acceso por 48h a herramientas de respiración + 1 Propuesta de Santuario Físico vía BNT IATA Partner.</p> 
                            </div> 
                            <div onclick="window.KERNEL.procesarPagoStripe('ELITE_399', '${uuid}')" class="luxury-card-price tier-card-elite"> 
                                <div class="card-ribbon-gold">RECOMENDADO</div> 
                                <div style="font-size:11px; color:#C5A059; margin-top:5px; text-transform:uppercase; letter-spacing:1px;">ACCESO MENSUAL ILIMITADO</div> 
                                <div style="font-size:32px; font-weight:bold; margin:6px 0; color:#fff;">$399<span style="font-size:12px; color:#888;">/mes</span></div> 
                                <p style="font-size:11.5px; color:#fff; margin:0; line-height:1.4;">Entra todas las veces que quieras al mes. Soporte de desintoxicación 24/7 + Conserjería Ilimitada con créditos Virtuoso ($100 USD).</p> 
                            </div> 
                        </div> 
                    </div>
                `;
            }
        };

        window.KERNEL.procesarPagoStripe = function(tier, folio) {
            document.body.style.cursor = "wait";
            fetch("/create-checkout-session", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tier: tier, folio: folio })
            })
            .then(res => res.json())
            .then(data => { 
                if (data.checkout_url) window.location.href = data.checkout_url; 
            })
            .catch(() => { 
                document.body.style.cursor = "default"; 
            });
        };

        // BYPASS DE ADMINISTRADOR EMBEBIDO CONTRA LAS COMPILACIONES DE RENDER
        const brandField = document.getElementById("brandTitleField");
        if (brandField) {
            brandField.addEventListener("click", () => {
                devClickCount++;
                if (devClickCount === 3) {
                    devClickCount = 0;
                    const u = prompt("Usuario de desarrollo:");
                    const p = prompt("Contraseña de desarrollo:");
                    fetch("/verify-dev-access", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ user: u, dev_pass: p })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.authenticated) {
                            window.location.href = "https://wellness-travel.onrender.com";
                        } else { 
                            alert("Credenciales de administrador incorrectas."); 
                        }
                    });
                }
            });
        }

        // GANCHO DE ESCUCHA AUTOMÁTICO DE RETORNO EXITOSO PARA PDF REPORTLAB
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('status') === 'success') {
            const paidFolio = urlParams.get('folio') || "MR-CONFIRMED";
            const rootNode = document.getElementById('open-than-go-root');
            if (rootNode) {
                rootNode.innerHTML = `
                    <div class="luxury-checkout-dock" style="text-align:center; padding:20px;"> 
                        <h1 style="font-family:'Times New Roman',serif; color:#C5A059; font-size:32px; margin-bottom:4px; letter-spacing:4px;">MAY ROGA</h1> 
                        <div style="font-size:10px; color:#8E8E93; letter-spacing:3px; text-transform:uppercase; margin-bottom:20px;">PASAPORTE ADQUIRIDO</div> 
                        <p style="font-size:14px; margin-bottom:30px; color:#E1E1E1; line-height:1.5;">Pago verificado de forma segura para el Folio: <b>${paidFolio}</b>. Tu pasaporte digital de alta gama está listo.</p> 
                        <button class="gold-btn" style="max-width:320px; margin:0 auto;" onclick="window.KERNEL.descargarPasaportePDF('${paidFolio}')">Descargar Pasaporte (PDF)</button> 
                    </div>
                `;
            }
        }

        window.KERNEL.descargarPasaportePDF = function(folio) {
            document.body.style.cursor = "wait";
            const selectedHotel = localStorage.getItem('mayroga_intent') || "H1";
            fetch("/generate-pdf", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    servicio_id: folio, 
                    lang: window.currentLang,
                    score_inicial: 45.0, 
                    score_actual: 75.0, 
                    respiracion_score: 100.0,
                    adivinanzas_score: 100.0, 
                    iev: 85.0, 
                    variante: "ELITE_RECONEXION", 
                    destino_id: selectedHotel
                })
            })
            .then(res => res.blob())
            .then(blob => {
                document.body.style.cursor = "default";
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; 
                a.download = `MayRoga_Passport_${folio}.pdf`;
                document.body.appendChild(a); 
                a.click(); 
                a.remove();
            })
            .catch(() => { 
                document.body.style.cursor = "default"; 
            });
        };

        document.addEventListener("DOMContentLoaded", () => {
            const botonIniciar = document.getElementById("btnUnlock");
            if (botonIniciar) {
                botonIniciar.addEventListener("click", () => {
                    if (window.KERNEL && typeof window.KERNEL.realInit === "function") {
                        window.KERNEL.realInit();
                    } else if (window.KERNEL && typeof window.KERNEL.init === "function") {
                        window.KERNEL.init();
                    } else {
                        console.error("[MAY ROGA LLC Error] El motor KERNEL aún no está disponible en memoria.");
                    }
                });
            }
        });
    </script>
</body>
