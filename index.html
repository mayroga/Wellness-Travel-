
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>MAY ROGA Live English</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172b4d;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.app{width:min(1000px,100%);margin:auto;padding:18px 16px 30px}
header{margin-bottom:12px}
h1{font-size:24px;margin:0 0 8px;letter-spacing:-.4px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:#64748b;margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex:none}
.dot.on{background:#16a34a}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mode{background:white;border:1px solid #d8e0ec;color:#334155;text-align:left;min-height:48px}
.mode.active{border:2px solid #245bd6;background:#eef4ff;color:#1746a2}
.mode strong{display:block;font-size:15px}
.controls,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.primary{background:#245bd6;color:white}
.stop,.delete{background:#b42318;color:white}
.secondary{background:#e8edf5;color:#24344d}
.light{background:white;border:1px solid #d8e0ec;color:#334155}
.panel{background:white;border:1px solid #dfe6ef;border-radius:13px;padding:15px;margin:12px 0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
h2{font-size:14px;margin:0}
.tag{font-size:10px;font-weight:700;color:#52627a;background:#eef2f7;padding:5px 8px;border-radius:20px}
.transcript{font-size:18px;line-height:1.55;overflow-wrap:anywhere}
.line{padding:7px 10px;margin:4px 0;border-radius:8px;border-bottom:1px solid #e8edf4;white-space:pre-wrap;overflow-wrap:anywhere}
.line.old{color:#52627a;background:#f8fafc}
.line.new{color:#14532d;background:#e8f9ed;border:1px solid #9bd9aa;box-shadow:0 0 13px rgba(34,197,94,.22);font-weight:500}
.line.current{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.interim{font-size:18px;line-height:1.55;overflow-wrap:anywhere}
.answer{font-size:20px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap}
.placeholder{font-size:14px;color:#94a3b8}
.note{font-size:12px;line-height:1.5;color:#64748b;margin-top:8px;white-space:pre-wrap}
.actions{margin-top:12px;margin-bottom:0}
details{margin-top:14px}
summary{cursor:pointer;font-size:13px;color:#52627a;padding:9px 0}
#fullTranscript{font-size:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.message{font-size:12px;line-height:1.5;color:#52627a;min-height:0;margin:8px 0}
.message:empty{display:none}
@media(max-width:520px){
 .app{padding:14px 10px 24px}
 h1{font-size:21px}
 .panel{padding:12px}
 .answer{font-size:18px}
 .transcript,.interim{font-size:16px}
 .modes{gap:7px}
 .mode{padding:11px 9px}
 button{padding:10px 11px}
}
</style>
</head>
<body>
<main class="app">
<header>
<h1>MAY ROGA Live English</h1>
<div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Listo</span></div>
</header>

<section class="modes" aria-label="Modo">
<button type="button" class="mode" data-mode="conversation" aria-pressed="false"><strong>Conversación</strong></button>
<button type="button" class="mode" data-mode="interview" aria-pressed="false"><strong>Preguntas y respuestas</strong></button>
</section>

<div class="controls">
<button id="startBtn" class="primary" type="button">Escuchar</button>
<button id="stopBtn" class="stop" type="button" disabled>Detener escucha</button>
<button id="clearBtn" class="delete" type="button">Borrar</button>
<button id="repeatAudioBtn" class="light" type="button" disabled>Repetir audio</button>
<button id="deleteAudioBtn" class="light" type="button" disabled>Borrar audio</button>
</div>

<section class="panel" aria-live="polite">
<div id="liveText" class="transcript"></div>
<div id="interimText" class="interim"></div>
</section>

<section class="panel" aria-live="polite">
<div class="panel-head">
<h2>Respuesta en inglés</h2>
<span id="answerTag" class="tag">INACTIVA</span>
</div>
<div id="answerText" class="answer"></div>
<div id="answerNote" class="note"></div>
<div class="actions">
<button id="suggestBtn" class="primary" type="button" disabled>Preparar respuesta</button>
<button id="copyBtn" class="secondary" type="button" disabled>Copiar respuesta</button>
</div>
</section>

<div id="message" class="message" role="status"></div>

<details>
<summary>Historial completo</summary>
<div id="fullTranscript">Todavía no hay texto reconocido.</div>
<div class="actions">
<button id="copyTranscriptBtn" class="light" type="button" disabled>Copiar transcripción</button>
<button id="translateBtn" class="light" type="button" disabled>Traducir al español</button>
</div>
<div id="translation" class="note"></div>
</details>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
const startBtn=$("startBtn"),stopBtn=$("stopBtn"),clearBtn=$("clearBtn");
const liveText=$("liveText"),interimText=$("interimText");
const answerText=$("answerText"),answerNote=$("answerNote");
const suggestBtn=$("suggestBtn"),copyBtn=$("copyBtn"),message=$("message");
const fullTranscript=$("fullTranscript"),copyTranscriptBtn=$("copyTranscriptBtn");
const translateBtn=$("translateBtn"),translation=$("translation");
const repeatAudioBtn=$("repeatAudioBtn"),deleteAudioBtn=$("deleteAudioBtn");
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

let recognition=null,listening=false,stopping=false,mode=null;
let finalLines=[],latestSpeech="",interimSpeech="";
let requestBusy=false,sessionId=0,modeVersion=0;
let pendingAuto=null,lastAutoKey="";
let audioChunks=[],mediaRecorder=null,microphoneStream=null,audioUrl=null;
let recordingWanted=false,restartTimer=null,playback=null;

function cleanText(s){return String(s||"").replace(/\s+/g," ").trim()}

function punctuate(text,final=true){
 let s=cleanText(text);
 if(!s)return "";
 s=s.replace(/\s+([,.!?;:])/g,"$1").replace(/([,.!?;:])([^\s])/g,"$1 $2").replace(/\bi\b/g,"I");
 s=s.charAt(0).toUpperCase()+s.slice(1);
 if(final&&!/[.!?]$/.test(s)){
  const first=s.split(/\s+/)[0].toLowerCase();
  const questions=["who","what","when","where","why","how","which","whose","whom","do","does","did","is","are","am","was","were","will","would","can","could","should","have","has","had"];
  s+=questions.includes(first)?"?":".";
 }
 return s;
}
function setStatus(text,on=false){
 $("statusText").textContent=text;
 $("statusDot").classList.toggle("on",on);
}
function notify(text){message.textContent=text||""}
function setPlaceholder(el,text){
 el.replaceChildren();
 if(!text)return;
 const span=document.createElement("span");
 span.className="placeholder";
 span.textContent=text;
 el.appendChild(span);
}
function allText(){return finalLines.join("\n\n")}

function renderTranscript(){
 liveText.replaceChildren();
 const hasInterim=!!interimSpeech;
 const oldLines=hasInterim?finalLines.slice(-3):finalLines.slice(-4,-1);
 oldLines.forEach(line=>{
  const div=document.createElement("div");
  div.className="line old";
  div.textContent=line;
  liveText.appendChild(div);
 });
 if(!hasInterim&&finalLines.length){
  const div=document.createElement("div");
  div.className="line new current";
  div.textContent=finalLines[finalLines.length-1];
  liveText.appendChild(div);
 }
 interimText.replaceChildren();
 if(hasInterim){
  const div=document.createElement("div");
  div.className="line new current";
  div.textContent=punctuate(interimSpeech,false);
  interimText.appendChild(div);
 }
 fullTranscript.textContent=allText()||"Todavía no hay texto reconocido.";
 copyTranscriptBtn.disabled=!finalLines.length;
 translateBtn.disabled=!finalLines.length;
 suggestBtn.disabled=!mode||!latestSpeech;
}

function setMode(next){
 if(mode!==next){
  mode=next;
  modeVersion++;
  pendingAuto=null;
  lastAutoKey="";
  setPlaceholder(answerText,"");
  answerNote.textContent="";
  copyBtn.disabled=true;
 }
 document.querySelectorAll("[data-mode]").forEach(b=>{
  const active=b.dataset.mode===mode;
  b.classList.toggle("active",active);
  b.setAttribute("aria-pressed",String(active));
 });
 $("answerTag").textContent=mode==="conversation"?"CONVERSACIÓN":"PREGUNTAS Y RESPUESTAS";
 notify("");
 renderTranscript();
 if(!listening)startListening();
}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

function initRecognition(){
 if(!SpeechRecognition){
  notify("Este navegador no ofrece reconocimiento de voz. Prueba Chrome actualizado.");
  return false;
 }
 recognition=new SpeechRecognition();
 recognition.lang="en-US";
 recognition.continuous=true;
 recognition.interimResults=true;
 recognition.maxAlternatives=3;

 recognition.onstart=()=>{
  listening=true;stopping=false;
  startBtn.disabled=true;startBtn.textContent="Escuchando";
  stopBtn.disabled=false;
  setStatus(mode?"Escuchando y preparando respuestas":"Escuchando",true);
  notify("");
 };
 recognition.onresult=e=>{
  let interim="";
  for(let i=e.resultIndex;i<e.results.length;i++){
   const result=e.results[i];
   const alternatives=Array.from(result).filter(a=>cleanText(a.transcript));
   alternatives.sort((a,b)=>(b.confidence||0)-(a.confidence||0));
   const spoken=cleanText((alternatives[0]||result[0]).transcript);
   if(!spoken)continue;
   if(result.isFinal){
    const formatted=punctuate(spoken,true);
    const previous=finalLines[finalLines.length-1]||"";
    if(formatted!==previous){
     finalLines.push(formatted);
     latestSpeech=formatted;
     translation.textContent="";
     if(mode)queueAutoResponse(formatted,finalLines.slice(0,-1).slice(-7).join("\n"),mode);
    }
    interim="";
   }else{
    interim+=(interim?" ":"")+spoken;
   }
  }
  interimSpeech=cleanText(interim);
  renderTranscript();
 };
 recognition.onerror=e=>{
  const err=e.error||"unknown";
  if(err==="not-allowed"||err==="service-not-allowed"){
   stopping=true;listening=false;recordingWanted=false;
   startBtn.disabled=false;startBtn.textContent="Continuar escuchando";
   stopBtn.disabled=true;setStatus("Micrófono no disponible");
   notify("Permite el acceso al micrófono en el navegador.");
   stopAudioRecording();return;
  }
  if(err==="audio-capture"){notify("No se encontró un micrófono disponible.");return}
  if(err==="network"){notify("Problema de conexión del reconocimiento.");return}
  if(err!=="no-speech"&&err!=="aborted")notify("Problema de reconocimiento: "+err);
 };
 recognition.onend=()=>{
  if(listening&&!stopping){
   clearTimeout(restartTimer);
   restartTimer=setTimeout(()=>{
    if(listening&&!stopping){
     try{recognition.start()}catch(e){}
    }
   },250);
  }else{
   listening=false;
   startBtn.disabled=false;startBtn.textContent="Continuar escuchando";
   stopBtn.disabled=true;setStatus("Escucha detenida");
  }
 };
 return true;
}

function setAudioAvailable(available){
 repeatAudioBtn.disabled=!available;
 deleteAudioBtn.disabled=!available&&!audioChunks.length&&!(mediaRecorder&&mediaRecorder.state==="recording");
}
function stopPlayback(){
 if(playback){
  playback.pause();
  try{playback.currentTime=0}catch(e){}
  playback=null;
 }
 repeatAudioBtn.textContent="Repetir audio";
}
function createRecorder(stream){
 if(typeof MediaRecorder==="undefined"||!stream)return;
 audioChunks=[];
 const recorder=new MediaRecorder(stream);
 mediaRecorder=recorder;
 recorder.ondataavailable=e=>{
  if(mediaRecorder===recorder&&e.data&&e.data.size)audioChunks.push(e.data);
 };
 recorder.onstop=()=>{
  if(mediaRecorder!==recorder)return;
  if(audioChunks.length){
   const blob=new Blob(audioChunks,{type:recorder.mimeType||"audio/webm"});
   if(audioUrl)URL.revokeObjectURL(audioUrl);
   audioUrl=URL.createObjectURL(blob);
  }
  setAudioAvailable(!!audioUrl);
 };
 try{recorder.start();setAudioAvailable(true)}catch(e){}
}
async function startAudioRecording(){
 recordingWanted=true;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(!recordingWanted||!listening){
   stream.getTracks().forEach(t=>t.stop());
   return;
  }
  microphoneStream=stream;
  createRecorder(stream);
 }catch(e){
  if(listening)notify("No se pudo grabar el audio.");
 }
}
function stopAudioRecording(){
 recordingWanted=false;
 if(mediaRecorder&&mediaRecorder.state!=="inactive"){
  try{mediaRecorder.stop()}catch(e){}
 }
 if(microphoneStream){
  microphoneStream.getTracks().forEach(track=>track.stop());
  microphoneStream=null;
 }
}
function startListening(){
 if(listening)return;
 if(!recognition&&!initRecognition())return;
 stopping=false;listening=true;
 startBtn.disabled=true;stopBtn.disabled=false;
 setStatus("Conectando micrófono",true);
 startAudioRecording();
 try{recognition.start()}
 catch(e){
  listening=false;startBtn.disabled=false;
  startBtn.textContent="Continuar escuchando";
  stopBtn.disabled=true;setStatus("Listo");
  notify("No se pudo iniciar. Comprueba los permisos del micrófono.");
 }
}
function stopListening(){
 if(!recognition||!listening)return;
 stopping=true;listening=false;
 clearTimeout(restartTimer);
 try{recognition.stop()}catch(e){}
 stopAudioRecording();
 startBtn.disabled=false;startBtn.textContent="Continuar escuchando";
 stopBtn.disabled=true;setStatus("Escucha detenida");
}
startBtn.addEventListener("click",startListening);
stopBtn.addEventListener("click",stopListening);

function clearConversation(){
 sessionId++;
 finalLines=[];latestSpeech="";interimSpeech="";
 pendingAuto=null;lastAutoKey="";
 requestBusy=false;
 answerNote.textContent="";translation.textContent="";
 setPlaceholder(answerText,"");copyBtn.disabled=true;
 renderTranscript();
 notify("");
 if(listening)setStatus(mode?"Escuchando y preparando respuestas":"Escuchando",true);
}
clearBtn.addEventListener("click",clearConversation);

function deleteAudio(){
 stopPlayback();
 if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null}
 audioChunks=[];
 repeatAudioBtn.textContent="Repetir audio";
 setAudioAvailable(false);
 if(mediaRecorder&&mediaRecorder.state==="recording"&&microphoneStream&&listening){
  const oldRecorder=mediaRecorder;
  const stream=microphoneStream;
  mediaRecorder=null;
  oldRecorder.addEventListener("stop",()=>{
   if(listening&&recordingWanted&&microphoneStream===stream)createRecorder(stream);
  },{once:true});
  try{oldRecorder.stop()}catch(e){if(listening&&recordingWanted)createRecorder(stream)}
 }
 notify("");
}
deleteAudioBtn.addEventListener("click",deleteAudio);

/* Cada frase final reconocida genera una respuesta automáticamente.
   Si llega otra mientras el servidor responde, se conserva la más reciente. */
function queueAutoResponse(text,context,selectedMode){
 if(!selectedMode||!text)return;
 const key=sessionId+"|"+modeVersion+"|"+selectedMode+"|"+text;
 if(key===lastAutoKey)return;
 lastAutoKey=key;
 pendingAuto={text,context,mode:selectedMode,session:sessionId,version:modeVersion,key};
 processAutoResponse();
}
async function processAutoResponse(){
 if(requestBusy||!pendingAuto)return;
 const job=pendingAuto;
 pendingAuto=null;
 if(job.session!==sessionId||job.version!==modeVersion||job.mode!==mode)return;
 requestBusy=true;
 suggestBtn.disabled=true;
 answerNote.textContent="";
 try{
  const res=await fetch("/api/respond",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({transcript:job.text,context:job.context,mode:job.mode})
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.detail||"No se pudo obtener una respuesta.");
  if(job.session===sessionId&&job.version===modeVersion&&job.mode===mode){
   answerText.textContent=cleanText(data.answer)||"No se recibió una respuesta útil.";
   answerNote.textContent=data.note||"";
   copyBtn.disabled=!cleanText(data.answer);
  }
 }catch(e){
  if(job.session===sessionId&&job.version===modeVersion&&job.mode===mode){
   answerNote.textContent=(e.message||"No se pudo conectar con el servicio.")+" Puedes pulsar «Preparar respuesta» para intentarlo otra vez.";
  }
 }finally{
  requestBusy=false;
  suggestBtn.disabled=!mode||!latestSpeech;
  if(pendingAuto)processAutoResponse();
 }
}

/* El botón manual utiliza la frase más reciente como respaldo. */
async function requestSuggestion(){
 if(!mode){notify("Selecciona Conversación o Preguntas y respuestas.");return}
 const text=cleanText(latestSpeech);
 if(!text){notify("Primero escucha una frase o pregunta en inglés.");return}
 if(requestBusy){
  pendingAuto={text,context:finalLines.slice(0,-1).slice(-7).join("\n"),mode,session:sessionId,version:modeVersion,key:"manual-"+Date.now()};
  notify("Preparando la respuesta más reciente.");
  return;
 }
 pendingAuto={text,context:finalLines.slice(0,-1).slice(-7).join("\n"),mode,session:sessionId,version:modeVersion,key:"manual-"+Date.now()};
 await processAutoResponse();
}
suggestBtn.addEventListener("click",requestSuggestion);

async function copyText(text,success){
 if(!text)return;
 try{await navigator.clipboard.writeText(text);notify(success)}
 catch(e){notify("Selecciona el texto y cópialo.")}
}
copyBtn.addEventListener("click",()=>copyText(answerText.textContent.trim(),"Respuesta copiada."));
copyTranscriptBtn.addEventListener("click",()=>copyText(allText(),"Transcripción copiada."));

translateBtn.addEventListener("click",async()=>{
 const text=allText();
 if(!text)return;
 translateBtn.disabled=true;translation.textContent="Traduciendo…";
 const currentSession=sessionId;
 try{
  const res=await fetch("/api/translate",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({transcript:text})
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.detail||"No se pudo traducir.");
  if(currentSession===sessionId)translation.textContent=data.translation||"No se recibió traducción.";
 }catch(e){
  if(currentSession===sessionId)translation.textContent=e.message||"Error de traducción.";
 }finally{translateBtn.disabled=!finalLines.length}
});

repeatAudioBtn.addEventListener("click",()=>{
 if(playback&&!playback.paused){
  stopPlayback();
  return;
 }
 if(!audioUrl){notify("No hay audio grabado.");return}
 playback=new Audio(audioUrl);
 repeatAudioBtn.textContent="Detener audio";
 playback.onended=()=>{
  playback=null;
  repeatAudioBtn.textContent="Repetir audio";
 };
 playback.onerror=()=>{
  playback=null;
  repeatAudioBtn.textContent="Repetir audio";
  notify("No se pudo reproducir el audio.");
 };
 playback.play().catch(()=>{
  playback=null;
  repeatAudioBtn.textContent="Repetir audio";
  notify("No se pudo reproducir el audio.");
 });
});

window.addEventListener("beforeunload",()=>{
 listening=false;stopping=true;clearTimeout(restartTimer);
 stopPlayback();
 if(recognition){try{recognition.stop()}catch(e){}}
 stopAudioRecording();
 if(audioUrl)URL.revokeObjectURL(audioUrl);
});

setPlaceholder(liveText,"");
setPlaceholder(answerText,"");
setAudioAvailable(false);
</script>
</body>
</html>
