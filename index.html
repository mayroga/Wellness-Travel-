
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>MAY ROGA Live English</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172b4d;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.app{width:min(1000px,100%);margin:auto;padding:22px 18px 40px}
header{margin-bottom:18px}
h1{font-size:26px;margin:0 0 7px;letter-spacing:-.4px}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:#64748b;margin-top:13px}
.dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;flex:none}
.dot.on{background:#16a34a}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.mode{background:white;border:1px solid #d8e0ec;color:#334155;text-align:left;min-height:54px}
.mode.active{border:2px solid #245bd6;background:#eef4ff;color:#1746a2}
.mode strong{display:block;font-size:16px}
.controls,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.primary{background:#245bd6;color:white}
.stop,.delete{background:#b42318;color:white}
.secondary{background:#e8edf5;color:#24344d}
.light{background:white;border:1px solid #d8e0ec;color:#334155}
.panel{background:white;border:1px solid #dfe6ef;border-radius:14px;padding:18px;margin:16px 0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h2{font-size:16px;margin:0}
.tag{font-size:11px;font-weight:700;color:#52627a;background:#eef2f7;padding:6px 9px;border-radius:20px}
.transcript{font-size:18px;line-height:1.55;overflow-wrap:anywhere}
.line{padding:8px 10px;margin:7px 0;border-radius:9px;background:#f1f4f8;color:#52627a;border:1px solid #e5eaf1}
.line.old{max-height:4.9em;overflow:hidden}
.line.new{background:#e8f9ed;border:1px solid #9bd9aa;color:#166534;box-shadow:0 0 13px rgba(34,197,94,.22);max-height:3.2em;overflow:hidden}
.interim{font-size:17px;line-height:1.55;overflow-wrap:anywhere}
.answer{font-size:21px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap}
.placeholder{font-size:15px;color:#94a3b8}
.note,.settings-note,footer{display:none}
.actions{margin-top:12px;margin-bottom:0}
details{margin-top:18px}
summary{cursor:pointer;font-size:14px;color:#52627a;padding:10px 0}
#fullTranscript{font-size:16px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
#translation{font-size:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.message{font-size:13px;line-height:1.5;color:#52627a;min-height:0;margin:8px 0}
@media(max-width:520px){.app{padding:16px 12px 28px}h1{font-size:23px}.panel{padding:13px}.answer{font-size:19px}.transcript{font-size:16px}.modes{gap:8px}.mode{padding:12px 10px}.controls,.actions{gap:8px}.controls button,.actions button{padding:11px 12px}}
</style>
</head>
<body>
<main class="app">
<header>
<h1>MAY ROGA Live English</h1>
<div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Listo</span></div>
</header>

<section class="modes" aria-label="Modo">
<button type="button" class="mode" data-mode="conversation" aria-pressed="false"><strong>Conversación</strong></button>
<button type="button" class="mode" data-mode="interview" aria-pressed="false"><strong>Preguntas y respuestas</strong></button>
</section>

<div class="controls">
<button id="startBtn" class="primary" type="button">Escuchar</button>
<button id="stopBtn" class="stop" type="button" disabled>Detener</button>
<button id="clearBtn" class="delete" type="button">Borrar</button>
</div>

<section class="panel" aria-live="polite">
<div id="liveText" class="transcript"><span class="placeholder"> </span></div>
<div id="interimText" class="interim"></div>
</section>

<section class="panel" aria-live="polite">
<div class="panel-head">
<h2>Respuesta en inglés</h2>
<span id="answerTag" class="tag">INACTIVA</span>
</div>
<div id="answerText" class="answer"><span class="placeholder"> </span></div>
<div id="answerNote" class="note"></div>
<div class="actions">
<button id="suggestBtn" class="primary" type="button" disabled>Preparar respuesta</button>
<button id="copyBtn" class="secondary" type="button" disabled>Copiar respuesta</button>
</div>
</section>

<div id="message" class="message" role="status"></div>

<details>
<summary>Historial completo</summary>
<div id="fullTranscript">Todavía no hay texto reconocido.</div>
<div class="actions">
<button id="copyTranscriptBtn" class="light" type="button" disabled>Copiar transcripción</button>
<button id="translateBtn" class="light" type="button" disabled>Traducir al español</button>
</div>
<div id="translation"></div>
</details>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
const startBtn=$("startBtn"),stopBtn=$("stopBtn"),clearBtn=$("clearBtn");
const liveText=$("liveText"),interimText=$("interimText"),answerText=$("answerText"),answerNote=$("answerNote");
const suggestBtn=$("suggestBtn"),copyBtn=$("copyBtn"),message=$("message");
const fullTranscript=$("fullTranscript"),copyTranscriptBtn=$("copyTranscriptBtn"),translateBtn=$("translateBtn"),translation=$("translation");
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,listening=false,stopping=false,mode=null;
let finalLines=[],latestSpeech="",interimSpeech="",requestBusy=false,sessionId=0;
let audioChunks=[],mediaRecorder=null,microphoneStream=null,audioUrl=null;
let recordingGeneration=0,restartTimer=null,recognitionStarting=false;

function cleanText(s){return String(s||"").replace(/\s+/g," ").trim()}
function setStatus(text,on=false){$("statusText").textContent=text;$("statusDot").classList.toggle("on",on)}
function notify(text){message.textContent=text}
function setPlaceholder(el,text){el.replaceChildren();const span=document.createElement("span");span.className="placeholder";span.textContent=text;el.appendChild(span)}
function allText(){return finalLines.join("\n\n")}

function renderTranscript(){
 liveText.replaceChildren();
 const visible=finalLines.slice(-3);
 visible.forEach(line=>{
  const div=document.createElement("div");
  div.className="line old";
  div.textContent=line;
  liveText.appendChild(div);
 });
 const interimParts=cleanText(interimSpeech).split(/(?<=[.!?])\s+/).filter(Boolean).slice(-2);
 if(interimParts.length){
  interimParts.forEach(line=>{
   const div=document.createElement("div");
   div.className="line new";
   div.textContent=line;
   liveText.appendChild(div);
  });
 }else if(visible.length){
  const last=liveText.lastElementChild;
  if(last){last.classList.remove("old");last.classList.add("new")}
 }
 if(!visible.length&&!interimParts.length)setPlaceholder(liveText," ");
 fullTranscript.textContent=allText()||"Todavía no hay texto reconocido.";
 copyTranscriptBtn.disabled=!finalLines.length;
 translateBtn.disabled=!finalLines.length;
 suggestBtn.disabled=!mode||!latestSpeech||requestBusy;
}

function setMode(next){
 mode=next;
 document.querySelectorAll("[data-mode]").forEach(b=>{
  const active=b.dataset.mode===mode;
  b.classList.toggle("active",active);
  b.setAttribute("aria-pressed",String(active));
 });
 $("answerTag").textContent=mode==="conversation"?"CONVERSACIÓN":"PREGUNTAS Y RESPUESTAS";
 setPlaceholder(answerText," ");
 answerNote.textContent="";
 suggestBtn.disabled=!latestSpeech||requestBusy;
 copyBtn.disabled=true;
 notify("");
}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));

function initRecognition(){
 if(!SpeechRecognition){notify("");setStatus("Voz no disponible");return false}
 recognition=new SpeechRecognition();
 recognition.lang="en-US";
 recognition.continuous=true;
 recognition.interimResults=true;
 recognition.maxAlternatives=3;

 recognition.onstart=()=>{
  recognitionStarting=false;
  if(stopping)return;
  listening=true;
  startBtn.disabled=true;
  stopBtn.disabled=false;
  setStatus("Escuchando",true);
  notify("");
 };

 recognition.onresult=e=>{
  let interim=[];
  for(let i=e.resultIndex;i<e.results.length;i++){
   const result=e.results[i];
   const alternatives=Array.from(result).filter(a=>cleanText(a.transcript));
   alternatives.sort((a,b)=>(b.confidence||0)-(a.confidence||0));
   const text=cleanText((alternatives[0]||result[0]||{}).transcript);
   if(!text)continue;
   if(result.isFinal){
    const previous=finalLines[finalLines.length-1]||"";
    if(text!==previous)finalLines.push(text);
    latestSpeech=text;
    interim=[];
    translation.textContent="";
   }else interim.push(text);
  }
  interimSpeech=cleanText(interim.join(" "));
  renderTranscript();
 };

 recognition.onerror=e=>{
  const err=e.error||"unknown";
  if(err==="not-allowed"||err==="service-not-allowed"){
   stopping=true;listening=false;recognitionStarting=false;
   startBtn.disabled=false;stopBtn.disabled=true;
   setStatus("Micrófono no disponible");notify("");
   return;
  }
  if(err==="audio-capture"){notify("");setStatus("Micrófono no disponible");return}
  if(err==="aborted"||err==="no-speech")return;
  if(err==="network")notify(" ");
 };

 recognition.onend=()=>{
  recognitionStarting=false;
  if(listening&&!stopping){
   scheduleRecognitionRestart();
  }else{
   listening=false;
   startBtn.disabled=false;
   stopBtn.disabled=true;
   setStatus("Detenida");
  }
 };
 return true;
}

function scheduleRecognitionRestart(){
 if(restartTimer)clearTimeout(restartTimer);
 restartTimer=setTimeout(()=>{
  restartTimer=null;
  if(!listening||stopping||!recognition||recognitionStarting)return;
  try{
   recognitionStarting=true;
   recognition.start();
  }catch(e){
   recognitionStarting=false;
   scheduleRecognitionRestart();
  }
 },250);
}

async function startAudioRecording(){
 const generation=++recordingGeneration;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==="undefined")return;
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(generation!==recordingGeneration||!listening||stopping){
   stream.getTracks().forEach(t=>t.stop());
   return;
  }
  microphoneStream=stream;
  audioChunks=[];
  mediaRecorder=new MediaRecorder(stream);
  const recorder=mediaRecorder;
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)audioChunks.push(e.data)};
  recorder.onstop=()=>{
   if(recorder!==mediaRecorder||!audioChunks.length)return;
   const blob=new Blob(audioChunks,{type:recorder.mimeType||"audio/webm"});
   if(audioUrl)URL.revokeObjectURL(audioUrl);
   audioUrl=URL.createObjectURL(blob);
   $("repeatAudioBtn").disabled=false;
  };
  recorder.start();
 }catch(e){}
}

function stopAudioRecording(){
 recordingGeneration++;
 if(mediaRecorder&&mediaRecorder.state!=="inactive"){
  try{mediaRecorder.stop()}catch(e){}
 }
 if(microphoneStream){
  microphoneStream.getTracks().forEach(track=>track.stop());
  microphoneStream=null;
 }
}

function startListening(){
 if(listening||recognitionStarting)return;
 if(!recognition&&!initRecognition())return;
 stopping=false;
 listening=true;
 startBtn.disabled=true;
 stopBtn.disabled=false;
 setStatus("Conectando",true);
 notify("");
 startAudioRecording();
 try{
  recognitionStarting=true;
  recognition.start();
 }catch(e){
  recognitionStarting=false;
  scheduleRecognitionRestart();
 }
}

function stopListening(){
 if(!listening&&!recognitionStarting)return;
 stopping=true;
 listening=false;
 recognitionStarting=false;
 if(restartTimer){clearTimeout(restartTimer);restartTimer=null}
 try{if(recognition)recognition.stop()}catch(e){}
 stopAudioRecording();
 startBtn.disabled=false;
 stopBtn.disabled=true;
 setStatus("Detenida");
}

startBtn.addEventListener("click",startListening);
stopBtn.addEventListener("click",stopListening);

function clearConversation(){
 sessionId++;
 finalLines=[];
 latestSpeech="";
 interimSpeech="";
 requestBusy=false;
 answerNote.textContent="";
 translation.textContent="";
 interimText.textContent="";
 setPlaceholder(answerText," ");
 copyBtn.disabled=true;
 if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl=null}
 audioChunks=[];
 if(mediaRecorder&&mediaRecorder.state!=="inactive"){
  try{mediaRecorder.stop()}catch(e){}
 }
 if(microphoneStream){
  microphoneStream.getTracks().forEach(t=>t.stop());
  microphoneStream=null;
 }
 recordingGeneration++;
 $("repeatAudioBtn").disabled=true;
 renderTranscript();
 notify("");
 if(listening&&!stopping){
  setStatus("Escuchando",true);
  startBtn.disabled=true;
  stopBtn.disabled=false;
 }else{
  setStatus("Listo");
  startBtn.disabled=false;
  stopBtn.disabled=true;
 }
}
clearBtn.addEventListener("click",clearConversation);

async function requestSuggestion(){
 const text=cleanText(latestSpeech);
 if(!mode)return;
 if(!text)return;
 if(requestBusy)return;
 requestBusy=true;
 const currentSession=sessionId;
 const currentMode=mode;
 suggestBtn.disabled=true;
 answerNote.textContent="";
 try{
  const context=finalLines.slice(-7,-1).join("\n");
  const res=await fetch("/api/respond",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({transcript:text,context,mode:currentMode})
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.detail||"");
  if(currentSession===sessionId){
   answerText.textContent=cleanText(data.answer)||"";
   answerNote.textContent=data.note||"";
   copyBtn.disabled=!cleanText(data.answer);
  }
 }catch(e){
  if(currentSession===sessionId)answerNote.textContent=e.message||"No se pudo obtener la respuesta.";
 }finally{
  requestBusy=false;
  suggestBtn.disabled=!mode||!latestSpeech;
 }
}
suggestBtn.addEventListener("click",requestSuggestion);

async function copyText(text,success){
 if(!text)return;
 try{await navigator.clipboard.writeText(text);notify(success)}
 catch(e){notify("No se pudo copiar.")}
}
copyBtn.addEventListener("click",()=>copyText(answerText.textContent.trim(),"Respuesta copiada."));
copyTranscriptBtn.addEventListener("click",()=>copyText(allText(),"Transcripción copiada."));

translateBtn.addEventListener("click",async()=>{
 const text=allText();
 if(!text)return;
 translateBtn.disabled=true;
 translation.textContent="";
 const currentSession=sessionId;
 try{
  const res=await fetch("/api/translate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({transcript:text})
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.detail||"");
  if(currentSession===sessionId)translation.textContent=data.translation||"";
 }catch(e){
  if(currentSession===sessionId)translation.textContent=e.message||"No se pudo traducir.";
 }finally{
  translateBtn.disabled=!finalLines.length;
 }
});

const repeatButton=document.createElement("button");
repeatButton.id="repeatAudioBtn";
repeatButton.type="button";
repeatButton.className="light";
repeatButton.textContent="Repetir audio";
repeatButton.disabled=true;
$("startBtn").parentElement.insertBefore(repeatButton,clearBtn);
repeatButton.addEventListener("click",()=>{
 if(!audioUrl)return;
 const audio=new Audio(audioUrl);
 audio.play().catch(()=>{});
});

window.addEventListener("beforeunload",()=>{
 stopping=true;
 listening=false;
 if(restartTimer)clearTimeout(restartTimer);
 try{if(recognition)recognition.stop()}catch(e){}
 stopAudioRecording();
 if(audioUrl)URL.revokeObjectURL(audioUrl);
});
</script>
</body>
</html>
