<script>
    // Inicialización obligatoria del Kernel para evitar errores de referencia
    window.KERNEL = window.KERNEL || {};
    window.currentLang = "ES";

    window.KERNEL.setLanguage = function(lang) {
        window.currentLang = lang;
        const btnES = document.getElementById('btnLangES');
        const btnEN = document.getElementById('btnLangEN');
        
        if (btnES && btnEN) {
            if (lang === 'ES') {
                btnES.classList.add('active-lang');
                btnEN.classList.remove('active-lang');
            } else {
                btnEN.classList.add('active-lang');
                btnES.classList.remove('active-lang');
            }
        }
    };
</script>

<script>
    // Variables globales de control del motor en producción
    let serviceTimer = null;
    let voiceInterval = null;
    let breatheInterval = null;
    let timeRemaining = 15 * 60;
    let userAnswers = [];
    let devClickCount = 0;

    // 🎯 CRONOGRAMA MAESTRO DEL TRIÁNGULO...

    // 🎯 CRONOGRAMA MAESTRO DEL TRIÁNGULO: 5 Apariciones (3 fijas exactas y 2 calculadas al azar)
    let randomSec1 = Math.floor(Math.random() * (780 - 540) + 540); 
    let randomSec2 = Math.floor(Math.random() * (360 - 120)) + 120; // ¡CORREGIDO! Paréntesis cerrado limpiamente
    const CRONOGRAMA_TRIANGULO = [900, 460, 50, randomSec1, randomSec2]; // Segundos de interrupción del reloj

    // Inicializador dinámico del trayecto interactivo
    window.KERNEL.init = function() {
        const giantBox = document.getElementById('giantLangBox');
        if (giantBox) giantBox.style.display = 'none';
        
        const panelLegal = document.getElementById('panelLegal');
        if (panelLegal) panelLegal.style.display = 'none';
        
        const panelService = document.getElementById('panelService');
        if (panelService) panelService.style.display = 'block';
        
        this.iniciarPulmonVisual();
        this.cargarFlujoSiguienteLocalStorage();
        this.hablar();

  // 🎰 MOTOR NO-LINEAL: Decide por entropía aleatoria si inicia por el cuestionario o por impacto del triángulo
  if (Math.random() > 0.5) {
    window.KERNEL.desplegarTrianguloCinematico();
  }

  serviceTimer = window.setInterval(() => {
    timeRemaining--;
    let mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
    let secs = (timeRemaining % 60).toString().padStart(2, '0');
    
    const clock = document.getElementById('clockDisplay');
    if (clock) clock.innerText = `${mins}:${secs}`;

    // INTERCEPCIÓN DEL RELOJ: Frena la pantalla y despliega el triángulo con sus partículas flotantes
    if (typeof CRONOGRAMA_TRIANGULO !== 'undefined' && CRONOGRAMA_TRIANGULO.includes(timeRemaining)) {
      window.KERNEL.desplegarTrianguloCinematico();
    }

    if (timeRemaining === 240) {
      window.KERNEL.inyectarPortalInteractivodeEscape();
    }

    if (timeRemaining <= 0) {
      window.KERNEL.finalizarAcompanamientoCRM();
    }
  }, 1000);
};

window.KERNEL.desplegarTrianguloCinematico = function() {
  let engine = document.getElementById('engineWrapper');
  if (engine) {
    engine.style.display = 'flex';
    setTimeout(() => { 
      engine.style.display = 'none'; 
    }, 20000); // 20 segundos de duración exacta en pantalla
  }
};

window.KERNEL.iniciarPulmonVisual = function() {
  if (breatheInterval) window.clearInterval(breatheInterval);
  let pasoSincronizado = 0;
  const ordenInstrucciones = window.currentLang === "ES" ? ["Inhala", "Retén", "Exhala", "Pausa"] : ["Inhale", "Hold", "Exhale", "Pause"];

  breatheInterval = window.setInterval(() => {
    let circle = document.getElementById('lungCircle');
    if (!circle) return;

    circle.innerText = ordenInstrucciones[pasoSincronizado];
    if (pasoSincronizado === 0) {
      circle.className = "center-wellness-circle lung-inhale";
    } else if (pasoSincronizado === 2) {
      circle.className = "center-wellness-circle lung-exhale";
    }
    pasoSincronizado = (pasoSincronizado + 1) % 4;
  }, 4000); // Guía Box Breathing: 4 segundos por etapa
};

window.KERNEL.cargarFlujoSiguienteLocalStorage = function() {
  let stack = document.getElementById('interactiveStack');
  if (!stack) return;

  let nodo = typeof RAW_RIDDLES_DATABASE !== 'undefined' ? RAW_RIDDLES_DATABASE : { es: "", en: "", ans_es: "" };
  let html = `<p style="font-size:14px; margin-bottom:20px; line-height:1.6; text-align:justify; color:#E1E1E1;">${window.currentLang === "ES" ? nodo.es : nodo.en}</p>`;
  html += `<div style="display:flex; flex-direction:column; gap:12px;">`;
  html += `<button class="triple-option-btn" id="opt_0" onclick="window.KERNEL.evaluarSeleccion(25, 0, true)">A. ${nodo.ans_es}</button>`;
  html += `<button class="triple-option-btn" id="opt_1" onclick="window.KERNEL.evaluarSeleccion(0, 1, false)">B. El Ruido Operativo</button>`;
  html += `</div>`;
  stack.innerHTML = html;
};

window.KERNEL.evaluarSeleccion = function(puntos, idx, esCorrecto) {
  const targetBtn = document.getElementById(`opt_${idx}`);
  if (targetBtn) {
    targetBtn.className = esCorrecto ? "triple-option-btn correct-choice" : "triple-option-btn wrong-choice";
  }
  userAnswers.push(puntos);
  const btnNext = document.getElementById('btnNext');
  if (btnNext) {
    btnNext.style.display = 'block';
  }
};

window.KERNEL.avanzarRetoContinuo = function() {
  const btnNext = document.getElementById('btnNext');
  if (btnNext) {
    btnNext.style.display = 'none';
  }
  window.KERNEL.finalizarAcompanamientoCRM();
};

window.KERNEL.hablar = function() {
  if (voiceInterval) window.clearInterval(voiceInterval);
  
  const dictarFraseOasis = () => {
    if ('speechSynthesis' in window) {
      let frase = window.currentLang === "ES" 
        ? "El verdadero poder es el control de tu tiempo." 
        : "True leverage is complete control over your focus.";
      let utterance = new SpeechSynthesisUtterance(frase);
      utterance.lang = window.currentLang === "ES" ? "es-US" : "en-US";
      window.speechSynthesis.speak(utterance);
    }
  };

  dictarFraseOasis();
  voiceInterval = window.setInterval(dictarFraseOasis, 25000);
};

window.KERNEL.procesarPagoStripe = function(tier, folio) {
  document.body.style.cursor = "wait";

  fetch("/create-checkout-session", {
    method: "POST",
    headers: { 
      "Content-Type": "application/json" 
    },
    body: JSON.stringify({ tier: tier, folio: folio })
  })
  .then(res => res.json())
  .then(data => {
    if (data.checkout_url) {
      window.location.href = data.checkout_url;
    }
  })

window.KERNEL.descargarPasaportePDF = function(folio) {
  document.body.style.cursor = "wait";
  fetch("/generate-pdf", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      servicio_id: folio, 
      lang: window.currentLang,
      score_inicial: 45.0, 
      score_actual: 75.0, 
      respiracion_score: 100.0,
      adivinanzas_score: 100.0, 
      iev: 85.0, 
      variante: "ELITE_RECONEXION", 
      destino_id: "H1"
    })
  })
  .then(res => res.blob())
  .then(blob => {
    document.body.style.cursor = "default";
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; 
    a.download = `MayRoga_Passport_${folio}.pdf`;
    document.body.appendChild(a); 
    a.click(); 
    a.remove();
  })
  .catch(() => { 
    document.body.style.cursor = "default"; 
  });
};
