window.KERNEL.init = function() {
  const giantLangBox = document.getElementById('giantLangBox');
  if (giantLangBox) giantLangBox.style.display = 'none';

  const panelLegal = document.getElementById('panelLegal');
  if (panelLegal) panelLegal.style.display = 'none';

  this.iniciarPulmonVisual();
  this.cargarFlujoSiguienteLocalStorage();
  this.hablar();

  // 🎰 MOTOR NO-LINEAL HEURÍSTICO: Decide al azar si arranca interrumpiendo con el triángulo
  if (Math.random() > 0.5) {
    window.KERNEL.desplegarTrianguloCinematico();
  }

  serviceTimer = window.setInterval(() => {
    timeRemaining--;
    let mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
    let secs = (timeRemaining % 60).toString().padStart(2, '0');
    
    const clockDisplay = document.getElementById('clockDisplay');
    if (clockDisplay) clockDisplay.innerText = `${mins}:${secs}`;

    // CONTROL DE RELOJ DE ALTA GAMA: 5 Interrupciones exactas de 20s cada una
    if (typeof CRONOGRAMA_TRIANGULO !== 'undefined' && CRONOGRAMA_TRIANGULO.includes(timeRemaining)) {
      window.KERNEL.desplegarTrianguloCinematico();
    }

    if (timeRemaining === 240) {
      window.KERNEL.inyectarPortalInteractivodeEscape();
    }

    if (timeRemaining <= 0) {
      window.KERNEL.finalizarAcompanamientoCRM();
    }
  }, 1000);
};

window.KERNEL.desplegarTrianguloCinematico = function() {
  let engine = document.getElementById('engineWrapper');
  if (engine) {
    engine.style.display = 'flex';
    setTimeout(() => {
      engine.style.display = 'none';
    }, 20000);
  }
};

window.KERNEL.cargarFlujoSiguienteLocalStorage = function() {
  if (!localStorage.getItem('mayroga_last_idx')) localStorage.setItem('mayroga_last_idx', "0");
  let lastIdx = parseInt(localStorage.getItem('mayroga_last_idx'));
  if (lastIdx >= POOL_EJERCICIOS.length || userAnswers.length >= 3) {
    const stack = document.getElementById('interactiveStack');
    if (stack) stack.innerHTML = `<p style="color:#C5A059; text-align:center; font-size:13px; letter-spacing:1px; text-transform:uppercase;">Sintonía en progreso. Sigue el pulmón biológico.</p>`;
    return;
  }
  this.inyectarPreguntaDom(POOL_EJERCICIOS[lastIdx]);
};

window.KERNEL.inyectarPreguntaDom = function(nodo) {
  let stack = document.getElementById('interactiveStack');
  const taskTitle = document.getElementById('lblTaskTitle');
  if (taskTitle) taskTitle.innerText = window.currentLang === "ES" ? nodo.q_es : nodo.q_en;
  let html = "";
  let opts = window.currentLang === "ES" ? nodo.opts_es : nodo.opts_en;
  opts.forEach((o, i) => {
    html += `<button class="triple-option-btn" id="opt_${i}" onclick="window.KERNEL.evaluarSeleccion(${o.p}, ${i}, ${o.c}, '${o.ex.replace(/'/g, "\\'")}', '${o.mood || ''}')">${o.t}</button>`;
  });
  if (stack) stack.innerHTML = html;
};

window.KERNEL.evaluarSeleccion = function(puntos, idx, esCorrecto, explicacion, moodElegido) {
  // CAMBIO DE COLOR DINÁMICO E INSTANTÁNEO HÁPTICO
  const targetBtn = document.getElementById(`opt_${idx}`);
  if (targetBtn) {
    targetBtn.className = esCorrecto ? "triple-option-btn correct-choice" : "triple-option-btn wrong-choice";
  }
  // Desactivamos temporalmente el resto de opciones para dar firmeza corporativa
  const btns = document.getElementsByClassName('triple-option-btn');
  for (let b of btns) { b.disabled = true; }
  if (moodElegido) { 
    detectedMood = moodElegido; 
    this.hablar(); 
  }
  userAnswers.push(puntos);
  let box = document.getElementById('lblExplanationBox');
  if (box) { 
    box.innerText = explicacion; 
    box.style.display = 'block'; 
  }
  const btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.style.display = 'block';
};

window.KERNEL.avanzarRetoContinuo = function() {
  const box = document.getElementById('lblExplanationBox');
  if (box) box.style.display = 'none';
  const btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.style.display = 'none';
  let idx = parseInt(localStorage.getItem('mayroga_last_idx') || "0") + 1;
  localStorage.setItem('mayroga_last_idx', idx.toString());
  this.cargarFlujoSiguienteLocalStorage();
};

    window.KERNEL.hablar = function() {
        if (voiceInterval) window.clearInterval(voiceInterval);
        let count = 0;
        const emitirVozOasis = () => {
            if ('speechSynthesis' in window) {
                let frase = "";
                count++;
                if (count % 3 === 0) {
                    let poolS = VOCABULARIO_SABIDURIA[window.currentLang.toLowerCase()];
                    frase = poolS[Math.floor(Math.random() * poolS.length)];
                } else {
                    let poolM = VOCABULARIO_MUTANTE[window.currentLang.toLowerCase()][detectedMood];
                    frase = poolM[Math.floor(Math.random() * poolM.length)];
                }
                let utterance = new SpeechSynthesisUtterance(frase);
                utterance.lang = window.currentLang === "ES" ? "es-US" : "en-US";
                window.speechSynthesis.speak(utterance);
            }
        };
        emitirVozOasis();
        voiceInterval = window.setInterval(emitirVozOasis, 15000);
