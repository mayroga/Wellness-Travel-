<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAY ROGA LLC | Premium Travel Architecture</title>
    <!-- ANALÍTICA ANÓNIMA Y PRIVADA (PLAUSIBLE) -->
    <script defer data-domain="tu-dominio-mayroga.com" src="https://plausible.io"></script>
    <script>
        window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };
    </script>
    <style>
        @import url('https://googleapis.com');

        :root {
            --bg-obsidian: #030305;
            --bg-matte-black: #050505;
            --bg-surface-dark: #0a0a0e;
            --luxury-card: #0a0a0e;
            --gold-champagne: #C5A059;
            --gold-primary: #A3704C;
            --gold-glow: rgba(197, 160, 89, 0.4);
            --gold-light: #C5A084;
            --white-ivory: #FFFFFF;
            --text-pure: #FFFFFF;
            --text-muted: #8E8E93;
            --text-dark: #222222;
            --wellness-green: #3D9970;
            --relax-blue: #1C3D5A;
            --alert-crimson: #E04F4F;
            --red-alert-base: #C0392B;
            --red-alert-glow: rgba(192, 57, 43, 0.4);
            --glass-background: rgba(15, 15, 18, 0.95);
            --glass-border: rgba(255, 255, 255, 0.06);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-obsidian);
            color: var(--white-ivory);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
        }
        .app-window {
            max-width: 460px;
            width: 100%;
            background: linear-gradient(145deg, rgba(15, 15, 18, 0.99), rgba(3, 3, 5, 1));
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 32px;
            padding: 40px 28px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.95), 0 0 60px rgba(197, 160, 89, 0.04);
            position: relative;
            overflow: hidden;
        }
        header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        header h1 {
            font-size: 28px;
            font-weight: 200;
            letter-spacing: 7px;
            color: var(--gold-champagne);
            text-transform: uppercase;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            cursor: pointer;
        }
        .lang-container-giant {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .giant-lang-btn {
            flex: 1;
            background: rgba(255,255,255,0.01);
            border: 2px solid var(--gold-champagne);
            color: var(--gold-champagne);
            padding: 20px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .giant-lang-btn:active, .giant-lang-btn.active-lang {
            background: var(--gold-champagne);
            color: var(--bg-obsidian);
            box-shadow: 0 0 20px var(--gold-glow);
        }
        h2 {
            font-size: 19px;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
            line-height: 1.4;
            text-align: center;
            color: var(--white-ivory);
        }
        p {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.7;
            color: var(--text-muted);
            margin-bottom: 24px;
            text-align: center;
        }
        .gold-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--gold-champagne);
            color: var(--gold-champagne);
            padding: 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .gold-btn:hover, .gold-btn:active {
            background: var(--gold-champagne);
            color: var(--bg-obsidian);
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .triple-option-btn {
            width: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--white-ivory);
            padding: 16px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 300;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .triple-option-btn:active {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--white-ivory);
        }
        .triple-option-btn.correct-choice {
            background-color: var(--wellness-green) !important;
            border-color: var(--wellness-green) !important;
            color: white !important;
            font-weight: 500;
            box-shadow: 0 0 15px rgba(61, 153, 112, 0.4);
        }
        .triple-option-btn.wrong-choice {
            background-color: var(--alert-crimson) !important;
            border-color: var(--alert-crimson) !important;
            color: white !important;
        }
        .timeline-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }
        .timer-display {
            font-size: 34px;
            font-family: "SF Mono", Consolas, monospace;
            font-weight: 200;
            color: var(--alert-crimson);
            text-shadow: 0 0 15px rgba(224, 79, 79, 0.4);
        }
        .graphics-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 5, 0.97);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: all 0.5s ease;
            text-align: center;
        }
        .triangle-canvas {
            width: 220px;
            height: 190px;
            position: relative;
            margin-bottom: 30px;
        }
        .vertex-node {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            position: absolute;
            z-index: 1100;
        }
        .v-top { top: 0; left: 103px; background-color: var(--alert-crimson); box-shadow: 0 0 20px var(--alert-crimson); }
        .v-left { bottom: 0; left: 0; background-color: var(--relax-blue); box-shadow: 0 0 20px var(--relax-blue); }
        .v-right { bottom: 0; right: 0; background-color: var(--gold-champagne); box-shadow: 0 0 20px var(--gold-champagne); }
        .energy-beam { position: absolute; width: 6px; height: 6px; border-radius: 50%; opacity: 0; }
        .beam-top { background: var(--alert-crimson); box-shadow: 0 0 15px var(--alert-crimson); animation: flyToCenterTop 2.5s infinite linear; }
        .beam-left { background: var(--relax-blue); box-shadow: 0 0 15px var(--relax-blue); animation: flyToCenterLeft 2.5s infinite linear; }
        .beam-right { background: var(--gold-champagne); box-shadow: 0 0 15px var(--gold-champagne); animation: flyToCenterRight 2.5s infinite linear; }
        @keyframes flyToCenterTop { 0% { top: 0; left: 110px; opacity: 1; transform: scale(1); } 100% { top: 300px; left: 110px; opacity: 0; transform: scale(0.1); } }
        @keyframes flyToCenterLeft { 0% { bottom: 0; left: 0; opacity: 1; transform: scale(1); } 100% { bottom: -120px; left: 110px; opacity: 0; transform: scale(0.1); } }
        @keyframes flyToCenterRight { 0% { bottom: 0; right: 0; opacity: 1; transform: scale(1); } 100% { bottom: -120px; right: 110px; opacity: 0; transform: scale(0.1); } }
        .center-wellness-circle {
            width: 95px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #C5A059 0%, #91723B 100%);
            box-shadow: 0 0 45px var(--gold-champagne);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #030305;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 4s linear;
        }
        .lung-inhale {
            width: 170px;
            height: 170px;
            background: radial-gradient(circle, #1C3D5A 0%, #0B1D33 100%) !important;
            box-shadow: 0 0 60px rgba(28, 61, 90, 1) !important;
            color: #FFFFFF !important;
        }
        .lung-exhale {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #E04F4F 0%, #992222 100%) !important;
            box-shadow: 0 0 35px rgba(224, 79, 79, 0.7) !important;
            color: #FFFFFF !important;
        }
        .explanation-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(197, 160, 89, 0.2);
            padding: 18px;
            border-radius: 12px;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 13.5px;
            line-height: 1.6;
            text-align: left;
            color: var(--gold-champagne);
            display: none;
        }
        .luxury-checkout-dock {
            animation: premiumFade 0.8s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
            text-align: center;
        }
        .premium-pricing-deck {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
            margin-top: 20px;
        }
        .luxury-card-price {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 25px 20px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .luxury-card-price:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .tier-card-elite {
            border: 1px solid var(--gold-champagne) !important;
            background: linear-gradient(180deg, rgba(197, 160, 89, 0.03) 0%, rgba(0, 0, 0, 0.8) 100%) !important;
            box-shadow: 0 15px 40px rgba(197, 160, 89, 0.1) !important;
            position: relative;
        }
        .card-ribbon-gold {
            position: absolute;
            top: -10px;
            left: 16px;
            background: var(--gold-champagne);
            color: black;
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .premium-portal-panel {
            border: 1px solid var(--alert-crimson);
            background: rgba(5, 5, 5, 0.98);
            padding: 20px;
            border-radius: 16px;
            margin-top: 15px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(224, 79, 79, 0.15);
        }
        .portal-mini-btn {
            background: rgba(224, 79, 79, 0.1);
            border: 1px solid var(--alert-crimson);
            padding: 12px 22px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 4px;
            display: inline-block;
            color: white;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .portal-mini-btn:active {
            background: var(--alert-crimson);
            transform: scale(0.96);
        }
        @keyframes premiumFade {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <!-- INICIALIZACIÓN TEMPRANA DEL KERNEL PARA EVITAR ERRORES Y BLOQUEOS -->
    <script>
        window.KERNEL = window.KERNEL || {};
        window.currentLang = "ES";

        window.KERNEL.setLanguage = function(lang) {
            window.currentLang = lang;
            const btnES = document.getElementById('btnLangES');
            const btnEN = document.getElementById('btnLangEN');
            
            if (btnES && btnEN) {
                if (lang === 'ES') {
                    btnES.classList.add('active-lang');
                    btnEN.classList.remove('active-lang');
                } else {
                    btnEN.classList.add('active-lang');
                    btnES.classList.remove('active-lang');
                }
            }
        };
    </script>
</head>
<body>
    <div class="app-window" id="open-than-go-root">
        <header>
            <h1 id="brandTitleField">MAY ROGA LLC</h1>
        </header>

        <div class="lang-container-giant" id="giantLangBox">
            <button id="btnLangES" class="giant-lang-btn active-lang" onclick="window.KERNEL.setLanguage('ES')">ESPAÑOL</button>
            <button id="btnLangEN" class="giant-lang-btn" onclick="window.KERNEL.setLanguage('EN')">ENGLISH</button>
        </div>

        <h2 id="lblLegalTitle">Tu espacio privado de sintonía</h2>

        <div id="panelLegal">
            <button class="gold-btn" id="btnUnlock" onclick="window.KERNEL.init()">INICIAR</button>
            <div class="timeline-bar">
                <div class="timer-display" id="clockDisplay">15:00</div>
            </div>
            <div id="interactiveStack"></div>
            <p id="lblStatus">Alineando Frecuencias del Enfoque</p>
        </div>
    </div>

    <!-- CONTENEDOR DEL TRIÁNGULO CINEMÁTICO -->
    <div class="graphics-container" id="engineWrapper">
        <div class="triangle-canvas">
            <div class="vertex-node v-top"></div>
            <div class="vertex-node v-left"></div>
            <div class="vertex-node v-right"></div>
            <div class="energy-beam beam-top"></div>
            <div class="energy-beam beam-left"></div>
            <div class="energy-beam beam-right"></div>
        </div>
        <div class="center-wellness-circle" id="lungCircle">Inhala</div>
    </div>

<script>
    // Variables globales de control de estado del motor inmersivo
    let serviceTimer = null;
    let voiceInterval = null;
    let breatheInterval = null;
    let timeRemaining = 15 * 60; // 15 minutos exactos (900 segundos)
    let userAnswers = [];
    let devClickCount = 0;

    // BANCO DE ADIVINANZAS CRÍTICAS SENSORIALES
    const RAW_RIDDLES_DATABASE = {
        es: "El control absoluto del entorno comienza por la gestión de la pausa en los momentos críticos de alta densidad operativa.",
        en: "Absolute control of the environment begins with managing the pause during moments of high operational density.",
        ans_es: "La Pausa Estratégica"
    };

    // 🎯 CRONOGRAMA MAESTRO DEL TRIÁNGULO: 5 Apariciones (3 fijas exactas y 2 calculadas al azar)
    let randomSec1 = Math.floor(Math.random() * (780 - 540)) + 540; // Azar primera mitad
    let randomSec2 = Math.floor(Math.random() * (360 - 120)) + 120; // Azar segunda mitad (Paréntesis Corregido)
    const CRONOGRAMA_TRIANGULO = [900, 460, 50, randomSec1, randomSec2]; // Momentos de activación por 20 segundos

    window.KERNEL.init = function() {
        const giantBox = document.getElementById('giantLangBox');
        if (giantBox) giantBox.style.display = 'none';
        
        const btnUnlock = document.getElementById('btnUnlock');
        if (btnUnlock) btnUnlock.style.display = 'none';
        
        const legalTitle = document.getElementById('lblLegalTitle');
        if (legalTitle) legalTitle.style.display = 'none';

        // Ocultamos texto plano sobrante para evitar amontonamiento visual
        const statusLbl = document.getElementById('lblStatus');
        if (statusLbl) statusLbl.style.display = 'none';

        this.iniciarPulmonVisual();
        this.cargarFlujoSiguienteLocalStorage();
        this.hablar();

        // 🎰 MOTOR DE DESORDEN DINÁMICO (NO-LINEAL): Decide al azar si inicia congelando la pantalla con el triángulo
        if (Math.random() > 0.5) {
            window.KERNEL.desplegarTrianguloCinematico();
        }

        // Reloj maestro del CRM de acompañamiento
        serviceTimer = window.setInterval(() => {
            timeRemaining--;
            
            let mins = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            let secs = (timeRemaining % 60).toString().padStart(2, '0');
            const clock = document.getElementById('clockDisplay');
            if (clock) clock.innerText = `${mins}:${secs}`;

            // INTERCEPCIÓN MATEMÁTICA: Lanza el triángulo en las 5 marcas de tiempo exactas
            if (typeof CRONOGRAMA_TRIANGULO !== 'undefined' && CRONOGRAMA_TRIANGULO.includes(timeRemaining)) {
                window.KERNEL.desplegarTrianguloCinematico();
            }

            // Despliegue automático del Pasillo de Escape en el Minuto 4 (240 segundos)
            if (timeRemaining === 240) {
                window.KERNEL.inyectarPortalInteractivodeEscape();
            }

            if (timeRemaining <= 0) {
                window.KERNEL.finalizarAcompanamientoCRM();
            }
        }, 1000);
    };

    window.KERNEL.desplegarTrianguloCinematico = function() {
        let engine = document.getElementById('engineWrapper');
        if (engine) {
            engine.style.display = 'flex';
            setTimeout(() => {
                engine.style.display = 'none';
            }, 20000); // Se mantiene en escena por 20 segundos exactos (100s totales)
        }
    };

    window.KERNEL.iniciarPulmonVisual = function() {
        if (breatheInterval) window.clearInterval(breatheInterval);
        let pasoSincronizado = 0;
        
        // Guía activa de respiración Box Breathing bilingüe interactiva
        const ordenInstrucciones = window.currentLang === "ES" ? ["Inhala", "Retén", "Exhala", "Pausa"] : ["Inhale", "Hold", "Exhale", "Pause"];
        
        breatheInterval = window.setInterval(() => {
            let circle = document.getElementById('lungCircle');
            if (!circle) return;
            
            circle.innerText = ordenInstrucciones[pasoSincronizado];
            if (pasoSincronizado === 0) {
                circle.className = "center-wellness-circle lung-inhale";
            } else if (pasoSincronizado === 2) {
                circle.className = "center-wellness-circle lung-exhale";
            }
            pasoSincronizado = (pasoSincronizado + 1) % 4;
        }, 4000); // 4 segundos por cuadrante respiratorio
    };

    window.KERNEL.cargarFlujoSiguienteLocalStorage = function() {
        let stack = document.getElementById('interactiveStack');
        if (!stack) return;
        let nodo = RAW_RIDDLES_DATABASE;
        
        let html = `<p style="font-size:14px; margin-bottom:20px; line-height:1.6; text-align:justify; color:#E1E1E1;">${window.currentLang === "ES" ? nodo.es : nodo.en}</p>`;
        html += `<div style="display:flex; flex-direction:column; gap:12px;">`;
        html += `<button class="triple-option-btn" id="opt_0" onclick="window.KERNEL.evaluarSeleccion(25, 0, true)">A. ${nodo.ans_es}</button>`;
        html += `<button class="triple-option-btn" id="opt_1" onclick="window.KERNEL.evaluarSeleccion(0, 1, false)">B. El Ruido Operativo de la Rutina</button>`;
        html += `</div>`;
        stack.innerHTML = html;
    };

    window.KERNEL.evaluarSeleccion = function(puntos, idx, esCorrecto) {
        // RETROALIMENTACIÓN DE COLOR INSTANTÁNEA AL HACER CLIC
        const targetBtn = document.getElementById(`opt_${idx}`);
        if (targetBtn) {
            targetBtn.className = esCorrecto ? "triple-option-btn correct-choice" : "triple-option-btn wrong-choice";
        }
        userAnswers.push(puntos);
        
        // Bloqueo ergonómico: Mostramos el botón de continuar en vez de saltar directo a Stripe
        const btnNext = document.getElementById('btnNext');
        if (btnNext) btnNext.style.display = 'block';
    };

    window.KERNEL.avanzarRetoContinuo = function() {
        const btnNext = document.getElementById('btnNext');
        if (btnNext) btnNext.style.display = 'none';
        
        // Limpiamos la stack visual para mantener espacio limpio y elegante sin amontonamientos
        document.getElementById('interactiveStack').innerHTML = `<p style="color:#C5A059; text-align:center; font-size:13px; letter-spacing:1px;">SINTONÍA EN PROGRESO. SIGUE EL RITMO DEL PULMÓN SENSORIAL.</p>`;
    };

    window.KERNEL.inyectarPortalInteractivodeEscape = function() {
        const trayDock = document.getElementById('interactiveStack');
        if (trayDock) {
            // ENRUTAMIENTO REAL: Conexión directa a Google Maps en pestañas nuevas independientes
            trayDock.innerHTML = `
                <div class="premium-portal-panel">
                    <span style="font-size:11px; color:#E04F4F; font-weight:bold; letter-spacing:2px; text-transform:uppercase;">PASILLO DE ACCESO VIP ACTIVADO</span>
                    <p style="font-size:12px; margin:14px 0; color:#fff; line-height:1.5;">Coherencia cardíaca lograda localmente. Selecciona tu ubicación física de escape:</p>
                    <div style="display:flex; gap:12px; justify-content:center; margin-top:15px;">
                        <span class="portal-mini-btn" onclick="localStorage.setItem('mayroga_intent','H1'); window.open('https://google.com', '_blank');">🏨 Ver Eden Roc</span>
                        <span class="portal-mini-btn" onclick="localStorage.setItem('mayroga_intent','H2'); window.open('https://google.com', '_blank');">🏖️ Ver Amanera</span>
                    </div>
                </div>
            `;
        }
    };

    window.KERNEL.hablar = function() {
        if (voiceInterval) window.clearInterval(voiceInterval);
        const dictarFraseOasis = () => {
            if ('speechSynthesis' in window) {
                let frase = window.currentLang === "ES" ? "El verdadero poder es el control de tu tiempo." : "True leverage is complete control over your focus.";
                let utterance = new SpeechSynthesisUtterance(frase);
                utterance.lang = window.currentLang === "ES" ? "es-US" : "en-US";
                window.speechSynthesis.speak(utterance);
            }
        };
        dictarFraseOasis();
        voiceInterval = window.setInterval(dictarFraseOasis, 25000);
    };

    window.KERNEL.finalizarAcompanamientoCRM = function() {
        if (serviceTimer) window.clearInterval(serviceTimer);
        if (breatheInterval) window.clearInterval(breatheInterval);
        if (voiceInterval) window.clearInterval(voiceInterval);
        
        const uuid = "MR-" + Math.floor(100000 + Math.random() * 900000);
        const targetRoot = document.getElementById('open-than-go-root');
        if (targetRoot) {
            targetRoot.innerHTML = `
                <div class="luxury-checkout-dock">
                    <h1 style="font-family:'Times New Roman',serif; color:#C5A059; font-size:32px; margin-bottom:4px; letter-spacing:4px;">MAY ROGA</h1>
                    <div style="font-size:10px; color:#8E8E93; letter-spacing:3px; text-transform:uppercase; margin-bottom:24px;">WELLNESS TRAVEL ARCHITECTURE</div>
                    <p style="font-size:13.5px; text-align:justify; margin-bottom:25px; line-height:1.6; color:#E1E1E1;">
                        Tu pasaporte Élite ha sido compilado de forma privada bajo el Folio <b>\${uuid}</b>. Prescribimos aislamiento inmediato en nuestros santuarios de Host Agency para romper de raíz el bucle operativo de la rutina diaria.
                    </p>
                    <div class="premium-pricing-deck">
                        <!-- ENLACE OPERATIVO SINGLE RESET ($200 USD) -->
                        <div onclick="window.KERNEL.procesarPagoStripe('SINGLE_200', '\${uuid}')" class="luxury-card-price">
                            <div style="font-size:11px; color:#888; text-transform:uppercase; letter-spacing:1px;">PAGO ÚNICO (SINGLE RESET)</div>
                            <div style="font-size:32px; font-weight:bold; margin:6px 0; color:#fff;">$200</div>
                            <p style="font-size:11.5px; color:#aaa; margin:0; line-height:1.4;">Acceso por 48h a herramientas de respiración + 1 Propuesta de Santuario Físico vía BNT IATA Partner.</p>
                        </div>
                        <!-- ENLACE OPERATIVO ACCESO MENSUAL ILIMITADO ($399 USD) -->
                        <div onclick="window.KERNEL.procesarPagoStripe('ELITE_399', '\${uuid}')" class="luxury-card-price tier-card-elite">
                            <div class="card-ribbon-gold">RECOMENDADO</div>
                            <div style="font-size:11px; color:#C5A059; margin-top:5px; text-transform:uppercase; letter-spacing:1px;">ACCESO MENSUAL ILIMITADO</div>
                            <div style="font-size:32px; font-weight:bold; margin:6px 0; color:#fff;">$399<span style="font-size:12px; color:#888;">/mes</span></div>
                            <p style="font-size:11.5px; color:#fff; margin:0; line-height:1.4;">Entra todas las veces que quieras al mes. Soporte de desintoxicación 24/7 + Conserjería Ilimitada con créditos Virtuoso ($100 USD).</p>
                        </div>
                    </div>
                </div>
            `;
        }
    };

    window.KERNEL.procesarPagoStripe = function(tier, folio) {
        document.body.style.cursor = "wait";
        fetch("/create-checkout-session", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tier: tier, folio: folio })
        })
        .then(res => res.json())
        .then(data => {
            if (data.checkout_url) {
                window.location.href = data.checkout_url;
            }
        })
        .catch(() => { document.body.style.cursor = "default"; });
    };

    // 🕵️‍♂️ BYPASS DE ADMINISTRADOR CORREGIDO: Envía los parámetros de estatus que tu detector de URL espera
    const brandField = document.getElementById("brandTitleField");
    if (brandField) {
        brandField.addEventListener("click", () => {
            devClickCount++;
            if (devClickCount === 3) {
                devClickCount = 0;
                const u = prompt("Usuario de desarrollo:");
                const p = prompt("Contraseña de desarrollo:");
                fetch("/verify-dev-access", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user: u, dev_pass: p })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.authenticated) {
                        // Enviamos los query params exactos para pintar el botón de PDF al instante sin pagar
                        window.location.href = "https://wellness-travel.onrender.com";
                    } else {
                        alert("Credenciales incorrectas.");
                    }
                })
                .catch(() => alert("Error de comunicación de credenciales."));
            }
        });
    }

    // Escuchador automático del gancho de éxito de Stripe para descargas de PDFs
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('status') === 'success') {
        const paidFolio = urlParams.get('folio') || "MR-CONFIRMED";
        const rootNode = document.getElementById('open-than-go-root');
        if (rootNode) {
            rootNode.innerHTML = `
                <div class="luxury-checkout-dock" style="text-align:center; padding:20px;">
                    <h1 style="font-family:'Times New Roman',serif; color:#C5A059; font-size:32px; margin-bottom:4px; letter-spacing:4px;">MAY ROGA</h1>
                    <div style="font-size:10px; color:#8E8E93; letter-spacing:3px; text-transform:uppercase; margin-bottom:20px;">PASAPORTE ADQUIRIDO</div>
                    <p style="font-size:14px; margin-bottom:30px; color:#E1E1E1; line-height:1.5;">Pago verificado de forma segura para el Folio: <b>\${paidFolio}</b>. Tu pasaporte digital de alta gama ha sido compilado.</p>
                    <button class="gold-btn" style="max-width:320px; margin:0 auto;" onclick="window.KERNEL.descargarPasaportePDF('\${paidFolio}')">Descargar Pasaporte (PDF)</button>
                </div>
            `;
        }
    }

    window.KERNEL.descargarPasaportePDF = function(folio) {
        document.body.style.cursor = "wait";
        const selectedHotel = localStorage.getItem('mayroga_intent') || "H1";
        fetch("/generate-pdf", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                servicio_id: folio,
                lang: window.currentLang,
                score_inicial: 45.0,
                score_actual: 75.0,
                respiracion_score: 100.0,
                adivinanzas_score: 100.0,
                iev: 85.0,
                variante: "ELITE_RECONEXION",
                destino_id: selectedHotel
            })
        })
        .then(res => res.blob())
        .then(blob => {
            document.body.style.cursor = "default";
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `MayRoga_Passport_\${folio}.pdf`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        })
        .catch(() => { document.body.style.cursor = "default"; alert("Error al compilar el documento."); });
    };
</script>
</body>
</html>
